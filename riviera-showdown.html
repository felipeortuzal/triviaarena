p:12px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:15px}.btn{white-space:normal;border:1px solid #6a4c9e;border-radius:13px;padding:12px 18px;font-weight:800;background:#32234e;color:white;min-height:46px}.btn.primary{background:linear-gradient(100deg,#a94dfc,#692be5);border-color:#b55cff}.btn.lime{background:var(--lime);border-color:var(--lime);color:#151321}.btn.ghost{background:transparent}.btn:hover:not(:disabled){filter:brightness(1.13)}.field{width:100%;min-height:48px;border:1px solid #55446f;border-radius:12px;background:#0e0d21;color:white;padding:11px 13px;outline-offset:3px}.field:focus{outline:2px solid #a65cf7}.label{display:block;font-size:13px;font-weight:800;margin:4px 0 7px;color:#e6d6ff}.muted{color:var(--muted)}.tiny{font-size:13px}.highlight{color:var(--lime)}.purple{color:#c47bff}.cardline{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.pill{border:1px solid #624b80;background:#241c3e;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:750}.selected{border-color:#c36bff!important;box-shadow:0 0 0 2px #9b49ed55}.status{padding:13px 15px;border:1px solid #574373;background:#2c2142;border-radius:12px;margin:12px 0}.error{border-color:#d66a83;color:#ffd2dd}.largecode{font-size:clamp(31px,6vw,58px);font-weight:900;letter-spacing:.035em;text-align:center;overflow-wrap:anywhere;padding:30px 12px;background:#0f0c24;border-radius:17px;border:1px solid #594275}.big-num{font-size:clamp(64px,10vw,116px);font-weight:950;letter-spacing:-.07em;line-height:1;color:var(--lime)}.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.player{padding:12px;background:#100e24;border:1px solid #46365e;border-radius:12px}.player b{display:block}.player span{font-size:12px;color:var(--muted)}.board{width:100%;border-collapse:collapse}.board th,.board td{padding:12px 8px;text-align:left;border-bottom:1px solid #49365e}.board th{font-size:12px;color:#bcb0d3;text-transform:uppercase}.result{padding:20px;border:1px solid #6c5286;background:#2a1e45;border-radius:18px}.result strong{font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1 1 160px}.tag{display:inline-block;padding:5px 10px;border:1px solid #695180;border-radius:9px;font-size:12px;color:#d9c6ef}.hide{display:none!important}.footer{margin-top:50px;font-size:13px;color:#a99cbd}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.options{display:flex;flex-wrap:wrap;gap:9px}.options button{flex:1 1 135px}.notice{border-left:3px solid var(--orange);padding:9px 14px;background:#3a2c24;color:#ffdeb1;border-radius:0 10px 10px 0}.homejoin{margin-top:24px}.tablewrap{overflow-x:auto}@media(max-width:720px){.grid{grid-template-columns:1fr}.shell{padding:18px 14px 70px}.panel{padding:18px}.hero{padding:22px 0}.top{padding:5px 14px}.logo{width:182px;height:57px}.btn{padding:11px 13px}.board th,.board td{padding:9px 5px;font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.lobby{position:relative;overflow:hidden}.lobby:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--lime),var(--purple),#33c4e5)}.lobby-count{border-color:#687e39;color:#ddff98;background:#253119}.invite-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,1.2fr);align-items:center;gap:20px;border:1px solid #7553a5;border-radius:19px;padding:24px;margin-top:22px;background:radial-gradient(ellipse at right top,#41306088,transparent 70%),#100e24}.invite-code{font-size:clamp(38px,5vw,60px);font-weight:950;line-height:1.2;letter-spacing:.14em;color:var(--lime);font-variant-numeric:tabular-nums}.invite-card .actions{align-items:stretch}.invite-card .actions .field{flex:1 1 260px;min-width:0}.invite-card .actions .btn{flex:0 0 auto}.player{position:relative;transition:border-color .18s,background .18s}.player:hover{border-color:#8466b5;background:#201737}.player span{display:block;margin-top:5px}.lobby button:focus-visible,.btn:focus-visible,.mode:focus-visible{outline:3px solid var(--lime);outline-offset:3px}@media(max-width:820px){.invite-card{grid-template-columns:1fr;padding:18px}.invite-card .actions .btn{flex:1 1 160px}}@media(max-width:440px){.invite-code{letter-spacing:.09em}.invite-card .actions{flex-direction:column}}
/* Riviera Showdown: jogo e final — design system sem dependência de frameworks. */
.game-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,.75fr);align-items:start;gap:18px}
.round-panel{position:relative;isolation:isolate;min-height:450px;background:linear-gradient(165deg,#252041 0%,#151125 70%)}
.round-panel:before{content:"";height:3px;position:absolute;top:0;left:22px;right:22px;background:linear-gradient(90deg,#c8ff4c,#8b55e8,#53d9ee);border-radius:4px}
.round-panel .largecode{font-size:clamp(44px,6.5vw,79px);font-weight:900;letter-spacing:.015em;line-height:1.25;min-height:185px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#301a56 0,#0e0d22 80%);border-color:#7351a6;text-shadow:0 0 30px #ab5bff44}
.round-panel .status{background:#1e2734;border-color:#4e7e91}
.round-panel .status b{color:var(--lime)}
.round-decision{padding:22px;border-radius:18px;border:1px solid #80658f;background:linear-gradient(135deg,#302340,#1c172c);display:grid;gap:13px}
.scoreboard{background:linear-gradient(160deg,#1a1730,#121025);position:sticky;top:100px}
.scoreboard .roster{grid-template-columns:1fr}
.scoreboard .player{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scoreboard .player b{min-width:0}
.scoreboard .player span{text-align:right;flex:0 0 auto}
.final-screen{max-width:890px;margin:25px auto 0;padding:clamp(25px,6vw,58px);background:radial-gradient(circle at 80% 0,#59296c55,transparent 60%),linear-gradient(135deg,#231d3a,#141326)}
.final-screen h1{font-size:clamp(52px,8vw,94px)}
.podium{display:grid;gap:10px;margin:30px 0}
.podium-item{display:grid;grid-template-columns:65px minmax(0,1fr) auto;gap:12px;align-items:center;background:#130f27;border:1px solid #4a3c66;border-radius:15px;padding:13px 20px}
.podium-item:first-child{border-color:#b8f54a;background:linear-gradient(90deg,#242e23,#171426)}
.podium-item span{font-size:28px}
.podium-item strong{font-size:19px;overflow-wrap:anywhere}
.podium-item b{font-size:18px;color:var(--lime)}
.history-row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #43365b;padding:12px 2px;font-size:14px}
.history-row span{color:var(--muted)}
.history-row b{color:var(--text);text-align:right}
@media(max-width:860px){.game-layout{grid-template-columns:1fr}.scoreboard{position:static}.round-panel .largecode{min-height:155px}}
@media(max-width:480px){.podium-item{grid-template-columns:39px minmax(0,1fr) auto;padding:12px 10px}.podium-item span{font-size:23px}.podium-item strong,.podium-item b{font-size:15px}.history-row{flex-direction:column;gap:5px}.history-row b{text-align:left}.round-panel .largecode{font-size:clamp(35px,9vw,62px)}}

/* Estimativa de Ranking + Misturado — edição Riviera Showdown */
.modes{grid-template-columns:repeat(3,minmax(0,1fr))}
.modes .mode{min-height:245px;border-color:#665182;background:linear-gradient(160deg,#281c46,#151125)}
.modes .mode.orange{background:linear-gradient(150deg,#352340,#191429)}
.modes .mode.selected{border-color:var(--lime)!important;box-shadow:0 0 0 2px #b9eb5455,0 18px 45px #0003}
.modes .emoji{display:inline-flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:20px;background:#39285e}
.rank-category{text-align:center}.rank-category h2{font-size:clamp(27px,3.5vw,44px);margin:8px 0}.rank-category p{max-width:600px;margin:auto}
.rank-target{display:grid;justify-items:center;padding:25px 16px;border:1px solid #7452b1;border-radius:20px;background:radial-gradient(ellipse at 50% 60%,#432e73 0%,#16142c 76%);gap:3px}
.rank-target span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:850;color:#c9b9eb;text-align:center}
.rank-target strong{font-size:clamp(76px,11vw,142px);letter-spacing:-.07em;line-height:1.1;color:var(--lime);text-shadow:0 0 45px #baf76544}
.rank-source{font-size:13px;color:#c7bcd8;text-align:center;border-top:1px solid var(--line);padding:15px 0;line-height:1.7}
.rank-source a{display:inline-block;text-underline-offset:4px}
.round-panel .board th,.round-panel .board td{white-space:normal;overflow-wrap:anywhere}
.round-panel .board td{vertical-align:top}
.round-panel .board td:last-child{font-weight:950}
.round-panel textarea.field{min-height:82px;resize:vertical}
@media(max-width:850px){.modes{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.modes{grid-template-columns:1fr}.modes .mode{min-height:175px}.rank-target strong{font-size:clamp(72px,20vw,115px)}}

.match-meter{margin:12px 0 22px;padding:12px 16px;border:1px solid #544078;background:#16102d;border-radius:14px}
.match-meter .row{margin-bottom:10px}.match-meter .tiny{color:#ede1fd;font-weight:800}
.match-track{height:8px;background:#39304e;border-radius:40px;overflow:hidden}
.match-track>span{display:block;height:100%;border-radius:40px;background:linear-gradient(90deg,#9d55ef,#c1f83d);transition:width .3s ease}
.custom-ranking{padding:16px;border:1px solid #6c518c;border-radius:16px;background:#130f26;display:grid;gap:13px}
.custom-ranking summary{font-weight:850;cursor:pointer;color:#e4d0ff;padding:3px 0}
.custom-ranking[open] summary{margin-bottom:12px}
.custom-ranking .grid{margin:12px 0}
.round-panel .tablewrap{max-width:100%}.round-panel .board{font-size:13px}
@media(max-width:600px){.round-panel .board th,.round-panel .board td{padding:9px 6px;font-size:12px}}

function localRankResolve(raw,d,limit){
 const value=norm(raw);
 if(!value)return {status:"empty",position:null};
 const matches=[];
 d.items.forEach((item,index)=>{
   if([item,...(d.aliases?.[item]||[])].some(label=>norm(label)===value))matches.push(index+1);
 });
 if(matches.length>1)return {status:"ambiguous",position:null};
 if(!matches.length)return {status:"unknown",position:null};
 if(matches[0]>limit)return {status:"out-of-cut",position:null};
 return {status:"valid",position:matches[0]};
}

function localRankScore(r){

 const rows=users.map(uid=>{
   const guess=guesses[uid]||'',override=overrides[uid];
   const state=override?{position:override.position||null,status:override.position?"corrected":"corrected-out"}:localRankResolve(guess,list,r.limit);
   return {uid,guess,position:state.position,status:state.status,delta:state.position===null?null:Math.abs(state.position-r.target),...(override?{reason:override.reason}:{})};
 });
 const sorted=rows.filter(x=>x.delta!==null).sort((a,b)=>a.delta-b.delta||a.uid.localeCompare(b.uid));
 let place=0,previous=null;
 sorted.forEach((x,i)=>{if(x.delta!==previous)place=i+1;previous=x.delta;x.place=place;x.points=({1:5,2:3,3:1})[place]||0});
 rows.filter(x=>x.delta===null).forEach(x=>{x.place=null;x.points=0});
 return Object.fromEntries(rows.map(x=>[x.uid,x]));
}

function importLocalRanking(fields){

 const normItems=items.map(norm),count=items.length;
 if(count<10||count>1000)throw Error("Lista precisa ter de 10 a 1.000 itens.");
 if(new Set(normItems).size!==count)throw Error("Itens duplicados na lista.");
 if(!fields.title||fields.title.trim().length<5||!fields.source||fields.source.trim().length<4||
   !fields.url?.startsWith("https://")||!fields.snapshot||fields.snapshot.trim().length<4||
   !fields.about||fields.about.trim().length<12)throw Error("Preencha título, fonte, URL HTTPS, data e critério.");
 const id="host-"+norm(fields.title).replace(/ /g,"-").slice(0,36);
 const list={id,title:fields.title.trim(),source:fields.source.trim(),url:fields.url.trim(),
  snapshot:fields.snapshot.trim(),about:fields.about.trim(),items,origin:"host",aliases:{},
  itemIds:items.map((_,i)=>id+"-"+(i+1))};

}

function localChooseRound(){
 const nextType=room.mode==="rank"?"rank":room.mode==="mixed"?(room.round?.type==="letters"?"rank":"letters"):"letters";
 const number=(room.number||0)+1;
 if(nextType==="letters"){
   const eligible=DATA.puzzles.map((p,i)=>({p,i})).filter(x=>x.p.enabled!==false).map(x=>x.i);
   const pool=eligible.filter(i=>!(room.usedLetters||[]).includes(i));
   const choices=pool.length?pool:eligible;
   const index=choices[random(choices.length)];
   room.usedLetters=pool.length?[...(room.usedLetters||[]),index]:[index];
   room.round={type:"letters",id:`frase-${number}`,index,hints:0,revealed:false,scored:false,resultReady:false,puzzleSnapshot:{...DATA.puzzles[index]}};
   room.localGuesses={};ownGuess="";submitted={};guessDrafts={};
 }else{
   const eligible=[...DATA.rankings,...Object.values(room.customRankings||{})].filter(d=>Array.isArray(d.items)&&d.items.length>=(d.origin==="host"?10:25)&&d.url?.startsWith("https://")&&d.source&&d.snapshot);
   if(!eligible.length)throw Error("Nenhuma lista de ranking disponível nesta prévia.");
   const combinations=[];
   for(const d of eligible)for(const limit of [10,25,50,100,250,500,1000].filter(n=>n<=d.items.length)){
     for(let target=1;target<=limit;target++)combinations.push({categoryId:d.id,limit,target});
   }
   const fresh=combinations.filter(x=>!(room.usedRanks||[]).includes(`${x.categoryId}:${x.limit}:${x.target}`));
   const choices=fresh.length?fresh:combinations;
   const selected=choices[random(choices.length)];
   const key=`${selected.categoryId}:${selected.limit}:${selected.target}`;
   room.usedRanks=fresh.length?[...(room.usedRanks||[]),key]:[key];
   const list=eligible.find(d=>d.id===selected.categoryId);
   room.round={type:"rank",id:`ranking-${number}`,...selected,revealed:false,scored:false,resultReady:false,listSnapshot:{...list,items:[...list.items]}};
   const d=rankData(room.round),sample=Math.min(selected.limit-1,selected.target+1);
   room.localGuesses={guest:d.items[sample]};
   ownGuess="";submitted={guest:true};guessDrafts={};
 }
 room.number=number;room.phase="playing";selectedWinner="";render();
}

function localScoreCurrentRound(winner){
 if(room.round.scored)return;
 const r=room.round;
 const awarded={};
 if(r.type==="rank"){
   if(!r.resultReady)throw Error("Revele os palpites antes de pontuar.");
   for(const result of Object.values(r.review||{})){
     awarded[result.uid]=result.points||0;
     room.scores[result.uid]=(room.scores[result.uid]||0)+(result.points||0);
   }
   room.roundHistory[r.id]={id:r.id,number:room.number,type:"rank",categoryId:r.categoryId,
     target:r.target,limit:r.limit,review:r.review,awarded,overrides:r.overrides||{},listSnapshot:r.listSnapshot};
 }else{
   if(Object.keys(r.guesses||{}).length&&r.resultReady){
     for(const result of Object.values(r.review||{})){
       awarded[result.uid]=result.points||0;
       room.scores[result.uid]=(room.scores[result.uid]||0)+(result.points||0);
     }
   }else if(winner&&room.members[winner]){
     awarded[winner]=1;room.scores[winner]=(room.scores[winner]||0)+1;
   }
   room.roundHistory[r.id]={id:r.id,number:room.number,type:"letters",index:r.index,
     hints:r.hints||0,winner,awarded,review:r.review||{},overrides:r.overrides||{},puzzleSnapshot:r.puzzleSnapshot};

function gradePhraseDemo(guess,puzzle){
 const normalize=x=>norm(x);
 const raw=normalize(guess),answer=normalize(puzzle.answer);
 if(!raw)return {status:"empty",points:0,reason:"Sem resposta"};
 if(raw===answer)return {status:"exact",points:2,reason:"Resposta exata"};
 if((puzzle.acceptedAnswers||[]).some(x=>normalize(x)===raw))return {status:"approx",points:1,reason:"Variação equivalente"};
 const digits=x=>x.split(" ").filter(t=>/^\d+$/.test(t)).join("|");
 if(digits(raw)!==digits(answer))return {status:"wrong",points:0,reason:"Número diferente"};
 const ignored=new Set(["a","as","o","os","de","do","da","dos","das","em","um","uma","no","na","nos","nas","e","por"]);
 const tokens=x=>x.split(" ").filter(t=>t&&!ignored.has(t));
 const a=tokens(answer),b=tokens(raw);
 const critical=new Set(["antigo","antiga","moderno","moderna","ocidental","oriental","bissexto","completa","permanente"]);
 if(a.some(x=>critical.has(x)&&!b.includes(x)))return {status:"review",points:0,reason:"Termo essencial ausente"};
 if(a.length>=2&&!b.includes(a[1]))return {status:"review",points:0,reason:"Termo principal ausente"};
 const matches=a.filter(x=>b.includes(x)).length;
 if(a.length>=3&&b.length>=3&&matches/a.length>=.75&&matches/b.length>=.7&&b.length<=a.length+2)
   return {status:"approx",points:1,reason:"Resposta aproximada reconhecida"};
 return {status:matches/a.length>=.5?"review":"wrong",points:0,reason:"Avaliável pelo anfitrião"};
}
function localPhraseReview(r){

 return Object.fromEntries(Object.keys(room.members||{}).map(uid=>{
  const guess=(room.localGuesses||{})[uid]||"";
  const grade=gradePhraseDemo(guess,puzzle);
  const override=r.overrides?.[uid];
  return [uid,{uid,guess,...(override?{status:"reviewed",points:override.points,reason:override.reason}:grade)}];
 }));
}

function localCorrectRanking({player,position,reason}){

async function loadData(){
  if(STANDALONE){
    const embedded=window.RIVIERA_EMBEDDED_DATA;
    if(embedded&&Array.isArray(embedded.puzzles)&&embedded.puzzles.length&&Array.isArray(embedded.rankings)){
      DATA=embedded;dataReady=true;dataProblem="";
    }else{
      DATA={puzzles:[FALLBACK_PUZZLE],rankings:[]};dataReady=false;dataProblem="Não foi possível ler os dados da prévia";
    }
    render();return;
  }
  dataProblem="";
  try{
    const response=await fetch("./data.json");
    if(!response.ok)throw Error("HTTP "+response.status);
    const data=await response.json();
    if(!Array.isArray(data.puzzles)||!data.puzzles.length||!Array.isArray(data.rankings))throw Error("Catálogo inválido");
    DATA=data;dataReady=true;
  }catch(e){
    DATA={puzzles:[FALLBACK_PUZZLE],rankings:[]};
    dataReady=false;dataProblem="Os desafios completos não carregaram ("+(e?.message||"erro desconhecido")+")";
  }
  render();
}
async function bootNetwork(){
  if(STANDALONE){connectionState="local";render();return}
  emulatorMode=(location.hostname==="localhost"||location.hostname==="127.0.0.1")&&new URLSearchParams(location.search).get("emulator")==="1";
  let config;
  try{
    config=(await import("./firebase-config.js")).firebaseConfig;
  }catch(e){connectionState="unavailable";connectionProblem="Falha ao carregar as configurações do Firebase.";render();return}
  if(emulatorMode){
    config={apiKey:"demo-riviera-web",authDomain:"demo-riviera-showdown.firebaseapp.com",
      databaseURL:"https://demo-riviera-showdown-default-rtdb.firebaseio.com",
      projectId:"demo-riviera-showdown",appId:"1:123456789:web:demo"};
  }
  configured=!!(config&&config.apiKey&&config.apiKey!=="COLE_AQUI"&&config.databaseURL?.startsWith("https://"));
  if(!configured){connectionState="unconfigured";render();return}
  connectionState="connecting";render();
  try{
    const [fa,au,da,gatewayModule,phraseModule,partyModule]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js"),
      import("./rooms-v2.js"),
      import("./phrases-v3.js"),
      import("./party-game-v5.js")
    ]);
    ({initializeApp}=fa);
    ({getAuth,signInAnonymously,onAuthStateChanged}=au);
    ({getDatabase,ref,set,update,onValue,get,remove}=da);
    const fapp=initializeApp(config);
    db=getDatabase(fapp);auth=getAuth(fapp);
    if(emulatorMode){
      // Só localhost + ?emulator=1. Nunca aponta a produção para um emulador.
      au.connectAuthEmulator(auth,"http://127.0.0.1:9099",{disableWarnings:true});
      da.connectDatabaseEmulator(db,"127.0.0.1",9000);
    }
    onAuthStateChanged(auth,async user=>{
      try{
        if(!user){uid=null;roomGateway=null;phraseGame=null;partyGame=null;connectionState="unavailable";connectionProblem="Autenticação indisponível.";render();return}
        uid=user.uid;
        roomGateway=gatewayModule.makeRoomGateway({
          db,uid,api:{ref:da.ref,get:da.get,set:da.set,runTransaction:da.runTransaction,
            onValue:da.onValue,onDisconnect:da.onDisconnect,serverTimestamp:da.serverTimestamp}
        });
        phraseGame=phraseModule.makePhraseGame({db,uid,api:{ref:da.ref,get:da.get,runTransaction:da.runTransaction},getPuzzles:()=>DATA.puzzles,randomIndex:random});
        partyGame=partyModule.createPartyGame({db,uid,api:{ref:da.ref,get:da.get,set:da.set,runTransaction:da.runTransaction,onValue:da.onValue},getPuzzles:()=>DATA.puzzles,getRankings:()=>DATA.rankings,randomIndex:random});
        connectionState="online";connectionProblem="";
        const pending=new URLSearchParams(location.search).get("room")?.toUpperCase();
        if(pending&&roomGateway.validateCode(pending)&&!roomId&&!localDemo){
          if(await roomGateway.resumeRoom(pending)){connectRoom(pending);return}
        }
        render();
      }catch(e){connectionProblem="Falha ao recuperar a sala: "+e.message;render()}
    });
    await signInAnonymously(auth);
  }catch(e){
    uid=null;db=null;roomGateway=null;phraseGame=null;partyGame=null;connectionState="unavailable";
    connectionProblem="Serviço de salas indisponível: "+(e?.message||"erro de rede");
    render();
  }
}

  render(); // mostra a interface antes de acessar a rede
  await loadData();
  await bootNetwork();
