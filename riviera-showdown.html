p:12px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:15px}.btn{white-space:normal;border:1px solid #6a4c9e;border-radius:13px;padding:12px 18px;font-weight:800;background:#32234e;color:white;min-height:46px}.btn.primary{background:linear-gradient(100deg,#a94dfc,#692be5);border-color:#b55cff}.btn.lime{background:var(--lime);border-color:var(--lime);color:#151321}.btn.ghost{background:transparent}.btn:hover:not(:disabled){filter:brightness(1.13)}.field{width:100%;min-height:48px;border:1px solid #55446f;border-radius:12px;background:#0e0d21;color:white;padding:11px 13px;outline-offset:3px}.field:focus{outline:2px solid #a65cf7}.label{display:block;font-size:13px;font-weight:800;margin:4px 0 7px;color:#e6d6ff}.muted{color:var(--muted)}.tiny{font-size:13px}.highlight{color:var(--lime)}.purple{color:#c47bff}.cardline{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.pill{border:1px solid #624b80;background:#241c3e;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:750}.selected{border-color:#c36bff!important;box-shadow:0 0 0 2px #9b49ed55}.status{padding:13px 15px;border:1px solid #574373;background:#2c2142;border-radius:12px;margin:12px 0}.error{border-color:#d66a83;color:#ffd2dd}.largecode{font-size:clamp(31px,6vw,58px);font-weight:900;letter-spacing:.035em;text-align:center;overflow-wrap:anywhere;padding:30px 12px;background:#0f0c24;border-radius:17px;border:1px solid #594275}.big-num{font-size:clamp(64px,10vw,116px);font-weight:950;letter-spacing:-.07em;line-height:1;color:var(--lime)}.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.player{padding:12px;background:#100e24;border:1px solid #46365e;border-radius:12px}.player b{display:block}.player span{font-size:12px;color:var(--muted)}.board{width:100%;border-collapse:collapse}.board th,.board td{padding:12px 8px;text-align:left;border-bottom:1px solid #49365e}.board th{font-size:12px;color:#bcb0d3;text-transform:uppercase}.result{padding:20px;border:1px solid #6c5286;background:#2a1e45;border-radius:18px}.result strong{font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1 1 160px}.tag{display:inline-block;padding:5px 10px;border:1px solid #695180;border-radius:9px;font-size:12px;color:#d9c6ef}.hide{display:none!important}.footer{margin-top:50px;font-size:13px;color:#a99cbd}.divider{border:0;border-top:1px solid var(--line);margin:18px 0}.options{display:flex;flex-wrap:wrap;gap:9px}.options button{flex:1 1 135px}.notice{border-left:3px solid var(--orange);padding:9px 14px;background:#3a2c24;color:#ffdeb1;border-radius:0 10px 10px 0}.homejoin{margin-top:24px}.tablewrap{overflow-x:auto}@media(max-width:720px){.grid{grid-template-columns:1fr}.shell{padding:18px 14px 70px}.panel{padding:18px}.hero{padding:22px 0}.top{padding:5px 14px}.logo{width:182px;height:57px}.btn{padding:11px 13px}.board th,.board td{padding:9px 5px;font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.lobby{position:relative;overflow:hidden}.lobby:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--lime),var(--purple),#33c4e5)}.lobby-count{border-color:#687e39;color:#ddff98;background:#253119}.invite-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,1.2fr);align-items:center;gap:20px;border:1px solid #7553a5;border-radius:19px;padding:24px;margin-top:22px;background:radial-gradient(ellipse at right top,#41306088,transparent 70%),#100e24}.invite-code{font-size:clamp(38px,5vw,60px);font-weight:950;line-height:1.2;letter-spacing:.14em;color:var(--lime);font-variant-numeric:tabular-nums}.invite-card .actions{align-items:stretch}.invite-card .actions .field{flex:1 1 260px;min-width:0}.invite-card .actions .btn{flex:0 0 auto}.player{position:relative;transition:border-color .18s,background .18s}.player:hover{border-color:#8466b5;background:#201737}.player span{display:block;margin-top:5px}.lobby button:focus-visible,.btn:focus-visible,.mode:focus-visible{outline:3px solid var(--lime);outline-offset:3px}@media(max-width:820px){.invite-card{grid-template-columns:1fr;padding:18px}.invite-card .actions .btn{flex:1 1 160px}}@media(max-width:440px){.invite-code{letter-spacing:.09em}.invite-card .actions{flex-direction:column}}
/* Riviera Showdown: jogo e final — design system sem dependência de frameworks. */
.game-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,.75fr);align-items:start;gap:18px}
.round-panel{position:relative;isolation:isolate;min-height:450px;background:linear-gradient(165deg,#252041 0%,#151125 70%)}
.round-panel:before{content:"";height:3px;position:absolute;top:0;left:22px;right:22px;background:linear-gradient(90deg,#c8ff4c,#8b55e8,#53d9ee);border-radius:4px}
.round-panel .largecode{font-size:clamp(44px,6.5vw,79px);font-weight:900;letter-spacing:.015em;line-height:1.25;min-height:185px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#301a56 0,#0e0d22 80%);border-color:#7351a6;text-shadow:0 0 30px #ab5bff44}
.round-panel .status{background:#1e2734;border-color:#4e7e91}
.round-panel .status b{color:var(--lime)}
.round-decision{padding:22px;border-radius:18px;border:1px solid #80658f;background:linear-gradient(135deg,#302340,#1c172c);display:grid;gap:13px}
.scoreboard{background:linear-gradient(160deg,#1a1730,#121025);position:sticky;top:100px}
.scoreboard .roster{grid-template-columns:1fr}
.scoreboard .player{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scoreboard .player b{min-width:0}
.scoreboard .player span{text-align:right;flex:0 0 auto}
.final-screen{max-width:890px;margin:25px auto 0;padding:clamp(25px,6vw,58px);background:radial-gradient(circle at 80% 0,#59296c55,transparent 60%),linear-gradient(135deg,#231d3a,#141326)}
.final-screen h1{font-size:clamp(52px,8vw,94px)}
.podium{display:grid;gap:10px;margin:30px 0}
.podium-item{display:grid;grid-template-columns:65px minmax(0,1fr) auto;gap:12px;align-items:center;background:#130f27;border:1px solid #4a3c66;border-radius:15px;padding:13px 20px}
.podium-item:first-child{border-color:#b8f54a;background:linear-gradient(90deg,#242e23,#171426)}
.podium-item span{font-size:28px}
.podium-item strong{font-size:19px;overflow-wrap:anywhere}
.podium-item b{font-size:18px;color:var(--lime)}
.history-row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #43365b;padding:12px 2px;font-size:14px}
.history-row span{color:var(--muted)}
.history-row b{color:var(--text);text-align:right}
@media(max-width:860px){.game-layout{grid-template-columns:1fr}.scoreboard{position:static}.round-panel .largecode{min-height:155px}}
@media(max-width:480px){.podium-item{grid-template-columns:39px minmax(0,1fr) auto;padding:12px 10px}.podium-item span{font-size:23px}.podium-item strong,.podium-item b{font-size:15px}.history-row{flex-direction:column;gap:5px}.history-row b{text-align:left}.round-panel .largecode{font-size:clamp(35px,9vw,62px)}}

/* Estimativa de Ranking + Misturado — edição Riviera Showdown */
.modes{grid-template-columns:repeat(3,minmax(0,1fr))}
.modes .mode{min-height:245px;border-color:#665182;background:linear-gradient(160deg,#281c46,#151125)}
.modes .mode.orange{background:linear-gradient(150deg,#352340,#191429)}
.modes .mode.selected{border-color:var(--lime)!important;box-shadow:0 0 0 2px #b9eb5455,0 18px 45px #0003}
.modes .emoji{display:inline-flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:20px;background:#39285e}
.rank-category{text-align:center}.rank-category h2{font-size:clamp(27px,3.5vw,44px);margin:8px 0}.rank-category p{max-width:600px;margin:auto}
.rank-target{display:grid;justify-items:center;padding:25px 16px;border:1px solid #7452b1;border-radius:20px;background:radial-gradient(ellipse at 50% 60%,#432e73 0%,#16142c 76%);gap:3px}
.rank-target span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:850;color:#c9b9eb;text-align:center}
.rank-target strong{font-size:clamp(76px,11vw,142px);letter-spacing:-.07em;line-height:1.1;color:var(--lime);text-shadow:0 0 45px #baf76544}
.rank-source{font-size:13px;color:#c7bcd8;text-align:center;border-top:1px solid var(--line);padding:15px 0;line-height:1.7}
.rank-source a{display:inline-block;text-underline-offset:4px}
.round-panel .board th,.round-panel .board td{white-space:normal;overflow-wrap:anywhere}
.round-panel .board td{vertical-align:top}
.round-panel .board td:last-child{font-weight:950}
.round-panel textarea.field{min-height:82px;resize:vertical}
@media(max-width:850px){.modes{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.modes{grid-template-columns:1fr}.modes .mode{min-height:175px}.rank-target strong{font-size:clamp(72px,20vw,115px)}}

<script>
// Regras de curadoria e importação de listas. Sem publicar dados não auditados.
function normalizeName(value){
 return String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ");
}
function allowedCuts(length){return [10,25,50,75,100,250,500,1000].filter(n=>n<=length)}
function validateCatalog(data){
 const issues=[],activeCodes=new Map(),activeAnswers=new Map(),ids=new Set();
 if(!Array.isArray(data?.puzzles)||!Array.isArray(data?.rankings))return ["Arquivo deve conter puzzles e rankings."];
 data.puzzles.forEach((p,i)=>{
   const at="puzzles["+i+"]";
   if(!/^frase-\d{4}$/.test(p.id||""))issues.push(at+": ID estável inválido");
   if(ids.has(p.id))issues.push(at+": ID repetido");ids.add(p.id);
   if(!["active","inactive"].includes(p.status))issues.push(at+": status inválido");
   if(!/^\d+\s+/.test(p.code||""))issues.push(at+": código sem número inicial");
   if(typeof p.answer!=="string"||p.answer.length<8)issues.push(at+": resposta incompleta");
   if(!Array.isArray(p.hints)||p.hints.length!==2||p.hints.some(h=>typeof h!=="string"||h.length<8)||normalizeName(p.hints[0])===normalizeName(p.hints[1]))issues.push(at+": dicas progressivas inválidas");
   if(!p.topic||!["Fácil","Médio","Difícil"].includes(p.level)||!p.explain)issues.push(at+": categoria/dificuldade/explicação ausente");
   if(p.reference&&!/^https:\/\//i.test(p.reference))issues.push(at+": referência não HTTPS");
   if(p.status==="active"){
     for(const [key,map,field] of [[normalizeName(p.code),activeCodes,"código"],[normalizeName(p.answer),activeAnswers,"resposta"]]){
       if(map.has(key))issues.push(at+": "+field+" duplicado de "+map.get(key));else map.set(key,p.id);
     }
   }else if(!p.duplicateOf)issues.push(at+": motivo/ID de duplicação ausente");
 });
 const listIds=new Set();
 for(const [i,l] of data.rankings.entries()){
   const at="rankings["+i+"]";
   if(!l.id||listIds.has(l.id))issues.push(at+": ID duplicado/ausente");listIds.add(l.id);
   if(!/^https:\/\//.test(l.url||"")||!l.source||!l.snapshot||!l.edition||!l.methodology||!l.category||!l.observedAt||!l.tiePolicy)issues.push(at+": procedência/edição/método incompletos");
   if(!/^\d{4}-\d{2}-\d{2}$/.test(l.observedAt||""))issues.push(at+": data de observação inválida");
   if(!Array.isArray(l.items)||l.items.length<10||l.items.length>1000||l.items.some(x=>typeof x!=="string"||!x.trim()))issues.push(at+": itens incompletos");
   if(!Array.isArray(l.itemIds)||l.itemIds.length!==l.items.length||new Set(l.itemIds).size!==l.itemIds.length)issues.push(at+": itemIds instáveis");
   const normalized=l.items.map(normalizeName);if(new Set(normalized).size!==normalized.length)issues.push(at+": nomes duplicados/ambíguos");
   const aliases=new Map();
   for(const [canonical,variants] of Object.entries(l.aliases||{})){
     if(!l.items.includes(canonical)||!Array.isArray(variants))issues.push(at+": aliases sem item canônico");
     for(const variant of Array.isArray(variants)?variants:[]){
       const key=normalizeName(variant);
       if(!key||aliases.has(key)&&aliases.get(key)!==canonical||l.items.some(x=>normalizeName(x)===key&&x!==canonical))issues.push(at+": alias ambíguo "+variant);
       aliases.set(key,canonical);
     }
   }
   const cuts=allowedCuts(l.items.length);
   if(!Array.isArray(l.allowedCuts)||l.allowedCuts.some(n=>!cuts.includes(n)))issues.push(at+": tamanho de recorte incompatível");
 }
 return issues;
}
function parseHostRanking(input){
 const meta=input||{};
 const title=String(meta.title||"").trim(),source=String(meta.source||"").trim();
 const url=String(meta.url||"").trim(),snapshot=String(meta.snapshot||"").trim();
 const methodology=String(meta.methodology||"").trim();
 const observedAt=String(meta.observedAt||"").trim();
 if(title.length<4||!source||!/^https:\/\//.test(url)||!snapshot||!methodology||!/^\d{4}-\d{2}-\d{2}$/.test(observedAt))throw Error("Informe título, fonte, URL HTTPS, edição, critério e data observada (AAAA-MM-DD).");
 const original=Array.isArray(meta.items)?meta.items:String(meta.items||"").split(/\r?\n/);
 const items=original.map(s=>String(s).trim().replace(/^\d{1,4}[.)-]\s+/,"").trim()).filter(Boolean);
 if(items.length<10||items.length>1000)throw Error("A lista deve ter de 10 a 1.000 itens ordenados.");
 if(items.some(x=>x.length>120))throw Error("Nome de item longo demais.");
 if(new Set(items.map(normalizeName)).size!==items.length)throw Error("Há itens repetidos ou ambíguos.");
 const aliasMap={};
 for(const [key,variants] of Object.entries(meta.aliases||{})){
   if(!items.includes(key)||!Array.isArray(variants))throw Error("Alias associado a item inexistente.");
   aliasMap[key]=variants.map(x=>String(x).trim()).filter(Boolean);
 }
 const all=new Map(items.map(item=>[normalizeName(item),item]));
 for(const [canonical,variants] of Object.entries(aliasMap)){
   for(const alias of variants){
     const key=normalizeName(alias);
     if(all.has(key)&&all.get(key)!==canonical)throw Error("Alias conflita com nome ou outro alias: "+alias);
     all.set(key,canonical);
   }
 }
 const id="user-"+normalizeName(title).replace(/\s/g,"-").slice(0,36);
 return {id,title,source,url,snapshot,observedAt,methodology,category:meta.category||"Lista da comunidade",tiePolicy:"Ordem declarada pelo anfitrião",status:"candidate-unverified",edition:"user-upload",items,aliases:aliasMap,
  itemIds:items.map((_,i)=>id+"-"+String(i+1).padStart(4,"0")),allowedCuts:allowedCuts(items.length),
  verificationScope:"Lista enviada por anfitrião; não validada pela curadoria Riviera Showdown."};
}

function rankData(r){return r.catalog||DATA.rankings.find(x=>x.id===r.categoryId)}

function localRankResolve(raw,d,limit){
 const value=norm(raw);
 if(!value)return {status:"empty",position:null};
 const matches=[];
 d.items.forEach((item,index)=>{
   if([item,...(d.aliases?.[item]||[])].some(label=>norm(label)===value))matches.push(index+1);
 });
 if(matches.length>1)return {status:"ambiguous",position:null};
 if(!matches.length)return {status:"unknown",position:null};
 if(matches[0]>limit)return {status:"out-of-cut",position:null};
 return {status:"valid",position:matches[0]};
}

function localRankScore(r){
 const list=rankData(r),users=Object.keys(room.members||{}),guesses=room.localGuesses||{},overrides=r.overrides||{};
 const rows=users.map(uid=>{
   const guess=guesses[uid]||'',override=overrides[uid];
   const state=override?{position:override.position||null,status:override.position?"corrected":"corrected-out"}:localRankResolve(guess,list,r.limit);
   return {uid,guess,position:state.position,status:state.status,delta:state.position===null?null:Math.abs(state.position-r.target),...(override?{reason:override.reason}:{})};
 });
 const sorted=rows.filter(x=>x.delta!==null).sort((a,b)=>a.delta-b.delta||a.uid.localeCompare(b.uid));
 let place=0,previous=null;
 sorted.forEach((x,i)=>{if(x.delta!==previous)place=i+1;previous=x.delta;x.place=place;x.points=({1:5,2:3,3:1})[place]||0});
 rows.filter(x=>x.delta===null).forEach(x=>{x.place=null;x.points=0});
 return Object.fromEntries(rows.map(x=>[x.uid,x]));
}

function watchRankingIfNecessary(id,roomValue){

  currentGuessRound=key;ownGuess="";submitted={};
  if(!key||!partyGame||localDemo)return;
  stopGuess=partyGame.watchMyGuess(id,r.id,value=>{ownGuess=value;if(room?.round?.id===r.id)render()},error);
  stopSubmissions=partyGame.watchSubmissions(id,r.id,value=>{submitted=value;if(room?.round?.id===r.id)render()},error);
}
function connectRoom(id){

function nextChoice(){const current=room.round;let type=room.mode==='mixed'?(current?.type==='letters'?'rank':'letters'):room.mode;if(type==='letters'){const used=room.usedLetters||[];let available=DATA.puzzles.map((_,i)=>i).filter(i=>!used.includes(i));if(!available.length)available=DATA.puzzles.map((_,i)=>i);const index=pick(available);return {type:'letters',index,hints:0,revealed:false,usedLetters:available.length===DATA.puzzles.length&&used.length? [index]:[...used,index]}}
 const pool=[...DATA.rankings,...(room.customRankings||[])];if(!pool.length)throw Error('Não há rankings cadastrados.');const used=room.usedRanks||[];let choices=pool.filter(x=>!used.includes(x.id));if(!choices.length)choices=pool;let c=pick(choices);const limits=[25,50,75,100,250,500,1000].filter(n=>n<=c.items.length);if(!limits.includes(c.items.length))limits.push(c.items.length);const limit=pick(limits);const history=room.targetHistory?.[c.id+'-'+limit]||[];let positions=Array.from({length:limit},(_,i)=>i+1).filter(i=>!history.includes(i));if(!positions.length)positions=Array.from({length:limit},(_,i)=>i+1);const target=pick(positions);const id='r'+Date.now().toString(36)+random(9999);return {type:'rank',categoryId:c.id,custom:room.customRankings?.find(x=>x.id===c.id)||null,limit,target,id,revealed:false,usedRanks:choices.length===pool.length&&used.length?[c.id]:[...used,c.id],targetHistory:{...(room.targetHistory||{}),[c.id+'-'+limit]:positions.length===limit&&history.length?[target]:[...history,target]}}}
async function nextRound(){if(localDemo){nextLocalRound();return}throw Error('Partidas online serão habilitadas na etapa 3.');if(!isHost())return;let add=nextChoice();const updateData={number:(room.number||0)+1,round:add};if(add.usedLetters)updateData.usedLetters=add.usedLetters;if(add.usedRanks)updateData.usedRanks=add.usedRanks;if(add.targetHistory)updateData.targetHistory=add.targetHistory;delete add.usedLetters;delete add.usedRanks;delete add.targetHistory;if(room.round?.type==='letters'&&room.round.revealed){const winner=$('#letter-winner')?.value;if(winner){updateData[`scores/${winner}`]=(room.scores?.[winner]||0)+1}}if(room.round?.type==='rank'&&room.round.revealed&&!room.round.scored){const ranked=scoreRank(room.round);const scores={...room.scores};ranked.forEach(x=>{if(x.place&&x.place<=3)scores[x.uid]=(scores[x.uid]||0)+({1:5,2:3,3:1}[x.place]||0)});updateData.scores=scores}await update(ref(db,'rooms/'+roomId),updateData)}

function localChooseRound(){
 const nextType=room.mode==="rank"?"rank":room.mode==="mixed"?(room.round?.type==="letters"?"rank":"letters"):"letters";
 const number=(room.number||0)+1;
 if(nextType==="letters"){

   const pool=eligible.filter(i=>!(room.usedLetters||[]).includes(i));

   room.round={type:"letters",id:`frase-${number}`,index,hints:0,revealed:false,scored:false,content:{...DATA.puzzles[index]}};
 }else{
   const eligible=DATA.rankings.filter(d=>Array.isArray(d.items)&&d.items.length>=10&&d.url?.startsWith("https://")&&d.source&&d.snapshot);
   if(!eligible.length)throw Error("Nenhuma lista de ranking disponível nesta prévia.");
   const combinations=[];
   for(const d of eligible)for(const limit of (d.allowedCuts||[25,50,75,100]).filter(n=>n<=d.items.length)){
     for(let target=1;target<=limit;target++)combinations.push({categoryId:d.id,limit,target});
   }
   const fresh=combinations.filter(x=>!(room.usedRanks||[]).includes(`${x.categoryId}:${x.limit}:${x.target}`));
   const choices=(fresh.length?fresh:combinations).filter(x=>!importedRankId||modeChoice!=="rank"||x.categoryId===importedRankId);
   const selected=choices[random(choices.length)];
   const key=`${selected.categoryId}:${selected.limit}:${selected.target}`;
   room.usedRanks=fresh.length?[...(room.usedRanks||[]),key]:[key];
   room.round={type:"rank",id:`ranking-${number}`,...selected,revealed:false,scored:false,resultReady:false,catalog:{...DATA.rankings.find(x=>x.id===selected.categoryId)}};
   const d=rankData(room.round),sample=Math.min(selected.limit-1,selected.target+1);
   room.localGuesses={guest:d.items[sample]};
   ownGuess="";submitted={guest:true};guessDrafts={};
 }
 room.number=number;room.phase="playing";selectedWinner="";render();
}

function nextLocalRound(){
 if(!localDemo||!room?.round?.revealed)return;
 if(room.localGame){localAdvance(false);return}
 if(room.roundLimit&&room.number>=room.roundLimit){
   room.roundHistory??={};
   const r=room.round;room.roundHistory["frase-"+room.number]={id:"frase-"+room.number,type:"letters",number:room.number,index:r.index,hints:r.hints||0,winner:"",winnerPoints:0,content:r.content||null};
   room.phase="finished";render();return;
 }
 const used=room.usedLetters||[],all=DATA.puzzles.map((p,i)=>p.status!=="inactive"?i:null).filter(i=>i!==null);
 let available=all.filter(i=>!used.includes(i));
 if(!available.length)available=all;
 const index=available[random(available.length)];
 room.usedLetters=available.length===all.length&&used.length?[index]:[...used,index];
 room.number++;room.round={type:"letters",id:"frase-"+room.number,index,hints:0,revealed:false,scored:false,content:{...DATA.puzzles[index]}};
 selectedWinner="";render();
}

function startDemoLobby(){
 localDemo=true;roomId="DEMO45";selectedWinner="";
 room={host:"local",mode:modeChoice,phase:"lobby",number:0,roundLimit:roundLimitChoice,localGame:true,
 members:{local:{uid:"local",nick:"Você (demo)",joined:Date.now(),online:true},
 guest:{uid:"guest",nick:"Amigo simulado",joined:Date.now()+1,online:true}},
 scores:{local:0,guest:0},roundHistory:{},usedLetters:[],usedRanks:[]};
 render();
}

function startDemoFromLobby(){
 if(!localDemo||room?.phase!=="lobby")return;
 localChooseRound();
}

function localScoreCurrentRound(winner){
 if(room.round.scored)return;
 const r=room.round;
 if(r.type==="rank"){
   if(!r.resultReady)throw Error("Revele os palpites antes de pontuar.");
   const awarded={};
   for(const result of Object.values(r.review||{})){
     awarded[result.uid]=result.points||0;
     room.scores[result.uid]=(room.scores[result.uid]||0)+(result.points||0);
   }
   room.roundHistory[r.id]={id:r.id,number:room.number,type:"rank",categoryId:r.categoryId,
     target:r.target,limit:r.limit,review:r.review,awarded,overrides:r.overrides||{}};
 }else{
   const points=winner?approximateScore:0;
   if(winner&&room.members[winner])room.scores[winner]=(room.scores[winner]||0)+points;
   room.roundHistory[r.id]={id:r.id,number:room.number,type:"letters",index:r.index,hints:r.hints||0,winner,winnerPoints:points,content:r.content||null};
 }
 r.scored=true;
}

function localAdvance(finish){
 if(!localDemo||!room?.round?.revealed||room.round.scored)return;
 localScoreCurrentRound(room.round.type==="letters"?($("#letter-winner")?.value||selectedWinner||""):"");
 if(finish||(room.roundLimit&&room.number>=room.roundLimit)){room.phase="finished";render();return}
 localChooseRound();
}

function finishLocalDemo(){localAdvance(true)}

function localSubmitGuess(guess){
 const text=String(guess||"").trim();
 if(!text||text.length>120)throw Error("Digite um palpite entre 1 e 120 caracteres.");
 room.localGuesses??={};
 room.localGuesses.local=text;ownGuess=text;submitted.local=true;
 render();
}

function localReveal(){
 const r=room.round;
 if(r.revealed){render();return}
 r.revealed=true;
 if(r.type==="rank"){
   r.guesses={...(room.localGuesses||{})};
   r.review=localRankScore(r);
   r.resultReady=true;
 }
 render();
}

function localCorrectRanking({player,position,reason}){
 const r=room.round;
 if(r.type!=="rank"||!r.resultReady||r.scored)throw Error("Esta rodada não permite correções.");
 const pos=Number(position),explanation=String(reason||"").trim();
 if(!Number.isInteger(pos)||pos<0||pos>r.limit)throw Error("Informe a posição de 0 até "+r.limit);
 if(explanation.length<8)throw Error("Escreva uma justificativa com pelo menos 8 caracteres.");
 if(!room.members[player])throw Error("Jogador não encontrado.");
 r.overrides??={};r.overrides[player]={position:pos,reason:explanation};
 r.review=localRankScore(r);render();
}
async function handle(action){if(busy)return;busy=true;try{if(action==="demo"){startDemo()}
else if(action==="demo-lobby"){startDemoLobby()}
else if(action==="stop-demo"){localDemo=false;room=null;roomId=null;guessDrafts={};render()}
else if(action==="leave-room"){
  currentRoomSubscription?.();currentRoomSubscription=null;clearPresence();stopGuess();stopSubmissions();currentGuessRound="";
  room=null;roomId=null;const q=new URLSearchParams(location.search);q.delete("room");
  history.replaceState(null,"",location.pathname+(q.size?"?"+q.toString():""));render()
}
else if(action==="close-room"){if(!isHost()||!roomGateway)throw Error("Apenas o anfitrião pode encerrar.");await roomGateway.closeRoom(roomId)}
else if(action==="retry-data"){await loadData()}
else if(action==="hint"&&localDemo){if(room.round?.type==='letters'){room.round.hints=Math.min(2,room.round.hints+1);render()}}
else if(action==="reveal"&&localDemo){if(room.round?.type==='rank')localReveal();else{room.round.revealed=true;render()}}
else if(['choose-letters','choose-rank','choose-mixed'].includes(action)){modeChoice=action.replace('choose-','').replace('rank','rank');render();const field=$('#mode');if(field)field.value=modeChoice;$('#nick')?.focus()}
else if(action==='create'){if(!onlineReady()||!roomGateway)throw Error('Salas online indisponíveis. Use Jogar neste aparelho ou configure o Firebase.');const name=getNick();const result=await roomGateway.createRoom({nick:name,mode:selectedMode(),roundLimit:Number($('#round-limit')?.value||roundLimitChoice)});connectRoom(result.code)}
else if(action==='join'){if(!onlineReady())throw Error('Salas online indisponíveis. Use Jogar neste aparelho.');const name=getNick();const id=($('#join-code')?.value||pendingJoinCode||new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(id.length!==6)throw Error('Digite um código de sala válido com 6 caracteres.');await joinRoom(id,name)}
else if(action==='copy'){
 const url=location.origin+location.pathname+'?room='+roomId+(emulatorMode?'&emulator=1':'');
 try{if(!navigator.clipboard?.writeText)throw Error('Clipboard indisponível');await navigator.clipboard.writeText(url);const b=$('[data-action="copy"]');if(b)b.textContent='✓ Link copiado'}
 catch{const field=$('#invite');if(field){field.focus();field.select()}else throw Error('Copie o convite manualmente: '+url)}
}
else if(action==='toggle-import'){importFormOpen=!importFormOpen;render()}
else if(action==='import-user'){const parser=STANDALONE?window.RIVIERA_IMPORTER:(await import('./catalog-v6.js')).parseHostRanking;if(typeof parser!=='function')throw Error('Validador indisponível.');const candidate=parser({title:$('#import-title')?.value,source:$('#import-source')?.value,url:$('#import-url')?.value,snapshot:$('#import-snapshot')?.value,observedAt:$('#import-observed')?.value,methodology:$('#import-method')?.value,items:$('#import-items')?.value});DATA.rankings=DATA.rankings.filter(l=>l.id!==candidate.id);DATA.rankings.push(candidate);importedRankId=candidate.id;modeChoice='rank';importStatus='Lista validada para demonstração local: '+candidate.items.length+' itens. Selecione Testar lobby e placar.';importFormOpen=false;render()}
else if(action==='import'&&isHost()){throw Error('Importação nas salas online precisa de revisão editorial. Use importação local.')}
else if(action==='start-game'&&localDemo){startDemoFromLobby()}
else if(action==='start-game'){if(!isHost()||!partyGame)throw Error('Somente o anfitrião pode iniciar.');await partyGame.start(roomId)}
else if(action==='next'&&localDemo){nextLocalRound()}
else if(action==='next'){if(!partyGame||!isHost())throw Error('Somente o anfitrião avança.');await partyGame.advance(roomId,{winner:room.round?.type==='letters'?($('#letter-winner')?.value||selectedWinner||''):'',winnerPoints:Number($('#phrase-points')?.value||approximateScore)});selectedWinner=''}
else if(action==='finish-game'&&localDemo){finishLocalDemo()}
else if(action==='finish-game'){if(!partyGame||!isHost())throw Error('Somente o anfitrião encerra.');await partyGame.advance(roomId,{winner:room.round?.type==='letters'?($('#letter-winner')?.value||selectedWinner||''):'',winnerPoints:Number($('#phrase-points')?.value||approximateScore),finish:true});selectedWinner=''}
else if(action==='hint'&&isHost()&&partyGame){await partyGame.hint(roomId)}
else if(action==='reveal'&&isHost()&&partyGame){if(room.round?.type==='rank')await partyGame.revealRanking(roomId);else await partyGame.revealPhrase(roomId)}
else if(action==='guess'&&room?.round?.type==='rank'){
 const guess=($('#guess')?.value||guessDrafts[roomId+':'+room.round.id]||'').trim();
 if(localDemo)localSubmitGuess(guess);
 else{if(!partyGame)throw Error('Partida indisponível.');ownGuess=await partyGame.submitGuess(roomId,guess);delete guessDrafts[roomId+':'+room.round.id];render()}
}
else if(action==='override'&&isHost()&&room?.round?.type==='rank'){
 const player=$('#override-player')?.value,position=Number($('#override-pos')?.value);
 const reason=($('#override-reason')?.value||rankOverrideReason||'').trim();
 if(localDemo)localCorrectRanking({player,position,reason});
 else{if(!partyGame)throw Error('Partida indisponível.');await partyGame.correctRanking(roomId,{player,position,reason})}
 rankOverrideReason='';
}
}catch(e){error(e)}finally{busy=false}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handle(b.dataset.action)});
document.addEventListener('change',e=>{if(e.target.id==='mode')modeChoice=e.target.value;if(e.target.id==='letter-winner')selectedWinner=e.target.value;if(e.target.id==='phrase-points')approximateScore=Number(e.target.value);if(['round-limit','round-limit-local'].includes(e.target.id))roundLimitChoice=Number(e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='nick')nick=e.target.value;if(e.target.id==='join-code')pendingJoinCode=e.target.value;if(e.target.id==='guess'&&room?.round)guessDrafts[roomId+':'+room.round.id]=e.target.value;if(e.target.id==='override-reason')rankOverrideReason=e.target.value});
async function loadData(){
  if(STANDALONE){
    const embedded=window.RIVIERA_EMBEDDED_DATA;
    if(embedded&&Array.isArray(embedded.puzzles)&&embedded.puzzles.length&&Array.isArray(embedded.rankings)){
      DATA=embedded;dataReady=true;dataProblem="";
    }else{
      DATA={puzzles:[FALLBACK_PUZZLE],rankings:[]};dataReady=false;dataProblem="Não foi possível ler os dados da prévia";
    }
    render();return;
  }
  dataProblem="";
  try{
    const response=await fetch("./data.json");
    if(!response.ok)throw Error("HTTP "+response.status);
    const data=await response.json();
    if(!Array.isArray(data.puzzles)||!data.puzzles.length||!Array.isArray(data.rankings))throw Error("Catálogo inválido");
    DATA=data;dataReady=true;
  }catch(e){
    DATA={puzzles:[FALLBACK_PUZZLE],rankings:[]};
    dataReady=false;dataProblem="Os desafios completos não carregaram ("+(e?.message||"erro desconhecido")+")";
  }
  render();
}
async function bootNetwork(){
  if(STANDALONE){connectionState="local";render();return}
  emulatorMode=(location.hostname==="localhost"||location.hostname==="127.0.0.1")&&new URLSearchParams(location.search).get("emulator")==="1";
  let config;
  try{
    config=(await import("./firebase-config.js")).firebaseConfig;
  }catch(e){connectionState="unavailable";connectionProblem="Falha ao carregar as configurações do Firebase.";render();return}
  if(emulatorMode){
    config={apiKey:"demo-riviera-web",authDomain:"demo-riviera-showdown.firebaseapp.com",
      databaseURL:"https://demo-riviera-showdown-default-rtdb.firebaseio.com",
      projectId:"demo-riviera-showdown",appId:"1:123456789:web:demo"};
  }
  configured=!!(config&&config.apiKey&&config.apiKey!=="COLE_AQUI"&&config.databaseURL?.startsWith("https://"));
  if(!configured){connectionState="unconfigured";render();return}
  connectionState="connecting";render();
  try{
    const [fa,au,da,gatewayModule,phraseModule,partyModule]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js"),
      import("./rooms-v2.js"),
      import("./phrases-v3.js"),
      import("./party-game-v5.js")
    ]);
    ({initializeApp}=fa);
    ({getAuth,signInAnonymously,onAuthStateChanged}=au);
    ({getDatabase,ref,set,update,onValue,get,remove}=da);
    const fapp=initializeApp(config);
    db=getDatabase(fapp);auth=getAuth(fapp);
    if(emulatorMode){
      // Só localhost + ?emulator=1. Nunca aponta a produção para um emulador.
      au.connectAuthEmulator(auth,"http://127.0.0.1:9099",{disableWarnings:true});
      da.connectDatabaseEmulator(db,"127.0.0.1",9000);
    }
    onAuthStateChanged(auth,async user=>{
      try{
        if(!user){uid=null;roomGateway=null;phraseGame=null;partyGame=null;connectionState="unavailable";connectionProblem="Autenticação indisponível.";render();return}
        uid=user.uid;
        roomGateway=gatewayModule.makeRoomGateway({
          db,uid,api:{ref:da.ref,get:da.get,set:da.set,runTransaction:da.runTransaction,
            onValue:da.onValue,onDisconnect:da.onDisconnect,serverTimestamp:da.serverTimestamp}
        });
        phraseGame=phraseModule.makePhraseGame({db,uid,api:{ref:da.ref,get:da.get,runTransaction:da.runTransaction},getPuzzles:()=>DATA.puzzles,randomIndex:random});
        partyGame=partyModule.createPartyGame({db,uid,api:{ref:da.ref,get:da.get,set:da.set,runTransaction:da.runTransaction,onValue:da.onValue},getPuzzles:()=>DATA.puzzles,getRankings:()=>DATA.rankings,randomIndex:random});
        connectionState="online";connectionProblem="";
        const pending=new URLSearchParams(location.search).get("room")?.toUpperCase();
        if(pending&&roomGateway.validateCode(pending)&&!roomId&&!localDemo){
          if(await roomGateway.resumeRoom(pending)){connectRoom(pending);return}
        }
        render();
      }catch(e){connectionProblem="Falha ao recuperar a sala: "+e.message;render()}
    });
    await signInAnonymously(auth);
  }catch(e){
    uid=null;db=null;roomGateway=null;phraseGame=null;partyGame=null;connectionState="unavailable";
    connectionProblem="Serviço de salas indisponível: "+(e?.message||"erro de rede");
    render();
  }
}
async function init(){
  render(); // mostra a interface antes de acessar a rede
  await loadData();
  await bootNetwork();
}
init();

</script></body></html>
