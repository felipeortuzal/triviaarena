/* Riviera Showdown: jogo e final — design system sem dependência de frameworks. */
.game-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,.75fr);align-items:start;gap:18px}
.round-panel{position:relative;isolation:isolate;min-height:450px;background:linear-gradient(165deg,#252041 0%,#151125 70%)}
.round-panel:before{content:"";height:3px;position:absolute;top:0;left:22px;right:22px;background:linear-gradient(90deg,#c8ff4c,#8b55e8,#53d9ee);border-radius:4px}
.round-panel .largecode{font-size:clamp(44px,6.5vw,79px);font-weight:900;letter-spacing:.015em;line-height:1.25;min-height:185px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#301a56 0,#0e0d22 80%);border-color:#7351a6;text-shadow:0 0 30px #ab5bff44}
.round-panel .status{background:#1e2734;border-color:#4e7e91}
.round-panel .status b{color:var(--lime)}
.round-decision{padding:22px;border-radius:18px;border:1px solid #80658f;background:linear-gradient(135deg,#302340,#1c172c);display:grid;gap:13px}
.scoreboard{background:linear-gradient(160deg,#1a1730,#121025);position:sticky;top:100px}
.scoreboard .roster{grid-template-columns:1fr}
.scoreboard .player{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scoreboard .player b{min-width:0}
.scoreboard .player span{text-align:right;flex:0 0 auto}
.final-screen{max-width:890px;margin:25px auto 0;padding:clamp(25px,6vw,58px);background:radial-gradient(circle at 80% 0,#59296c55,transparent 60%),linear-gradient(135deg,#231d3a,#141326)}
.final-screen h1{font-size:clamp(52px,8vw,94px)}
.podium{display:grid;gap:10px;margin:30px 0}
.podium-item{display:grid;grid-template-columns:65px minmax(0,1fr) auto;gap:12px;align-items:center;background:#130f27;border:1px solid #4a3c66;border-radius:15px;padding:13px 20px}
.podium-item:first-child{border-color:#b8f54a;background:linear-gradient(90deg,#242e23,#171426)}
.podium-item span{font-size:28px}
.podium-item strong{font-size:19px;overflow-wrap:anywhere}
.podium-item b{font-size:18px;color:var(--lime)}
.history-row{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #43365b;padding:12px 2px;font-size:14px}
.history-row span{color:var(--muted)}
.history-row b{color:var(--text);text-align:right}
@media(max-width:860px){.game-layout{grid-template-columns:1fr}.scoreboard{position:static}.round-panel .largecode{min-height:155px}}
@media(max-width:480px){.podium-item{grid-template-columns:39px minmax(0,1fr) auto;padding:12px 10px}.podium-item span{font-size:23px}.podium-item strong,.podium-item b{font-size:15px}.history-row{flex-direction:column;gap:5px}.history-row b{text-align:left}.round-panel .largecode{font-size:clamp(35px,9vw,62px)}}

/* Estimativa de Ranking + Misturado — edição Riviera Showdown */
.modes{grid-template-columns:repeat(3,minmax(0,1fr))}
.modes .mode{min-height:245px;border-color:#665182;background:linear-gradient(160deg,#281c46,#151125)}
.modes .mode.orange{background:linear-gradient(150deg,#352340,#191429)}
.modes .mode.selected{border-color:var(--lime)!important;box-shadow:0 0 0 2px #b9eb5455,0 18px 45px #0003}
.modes .emoji{display:inline-flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:20px;background:#39285e}
.rank-category{text-align:center}.rank-category h2{font-size:clamp(27px,3.5vw,44px);margin:8px 0}.rank-category p{max-width:600px;margin:auto}
.rank-target{display:grid;justify-items:center;padding:25px 16px;border:1px solid #7452b1;border-radius:20px;background:radial-gradient(ellipse at 50% 60%,#432e73 0%,#16142c 76%);gap:3px}
.rank-target span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:850;color:#c9b9eb;text-align:center}
.rank-target strong{font-size:clamp(76px,11vw,142px);letter-spacing:-.07em;line-height:1.1;color:var(--lime);text-shadow:0 0 45px #baf76544}
.rank-source{font-size:13px;color:#c7bcd8;text-align:center;border-top:1px solid var(--line);padding:15px 0;line-height:1.7}
.rank-source a{display:inline-block;text-underline-offset:4px}
.round-panel .board th,.round-panel .board td{white-space:normal;overflow-wrap:anywhere}
.round-panel .board td{vertical-align:top}
.round-panel .board td:last-child{font-weight:950}
.round-panel textarea.field{min-height:82px;resize:vertical}
@media(max-width:850px){.modes{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.modes{grid-template-columns:1fr}.modes .mode{min-height:175px}.rank-target strong{font-size:clamp(72px,20vw,115px)}}

.travel-setup .actions{margin-top:14px}.travel-players{margin:18px 0}.resume-card{display:grid;gap:12px;padding:16px;border:1px solid var(--lime);border-radius:15px;margin:18px 0;background:#222c23}.handoff{max-width:620px;margin:24px auto;text-align:center;padding:clamp(24px,6vw,48px)}.handoff h1{font-size:clamp(38px,8vw,64px);overflow-wrap:anywhere}.handoff-icon{font-size:60px;margin-bottom:16px}.handoff .btn{width:100%;margin-top:24px;min-height:54px}.turn-progress{margin-top:22px;font-weight:750;color:var(--lime)}.travel-header{margin-bottom:20px}.travel-turn{padding:12px 16px;border-left:3px solid var(--lime);background:#242c23;border-radius:0 12px 12px 0}.travel-turn p{margin:6px 0 0}.online-options{margin-top:24px}.online-options>summary{padding:16px;border:1px solid var(--line);border-radius:13px;cursor:pointer;font-weight:750}.how-to{margin-top:20px}.how-to summary{cursor:pointer;padding:12px 0;font-weight:750}.download-link{display:inline-block;padding:12px 0}.field{font-size:16px}.btn{touch-action:manipulation}.how-to summary:focus-visible{outline:2px solid var(--lime)}
@media(max-width:720px){.hero{padding:12px 0}.hero .lead{font-size:16px}.modes{gap:10px}.modes .mode{display:grid;grid-template-columns:42px minmax(0,1fr);gap:4px 12px;min-height:0;padding:14px}.modes .emoji{width:42px;height:42px;border-radius:12px;font-size:26px;grid-row:1/3}.modes h2{font-size:22px;margin:0}.modes p{display:none}.travel-players{grid-template-columns:repeat(2,minmax(0,1fr))}.handoff{margin:16px auto}.travel-header h2{font-size:24px}.travel-setup .actions .btn{min-height:48px}}

/* Riviera Showdown 2.0 — Arena identity · 12 NOV 2026 */
:root{--bg:#070910;--panel:#111520;--panel2:#171d2a;--line:#303847;--text:#f7f9fb;--muted:#a0aabb;--purple:#a995ff;--lime:#d5ff4d;--orange:#ffbc70}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{font-family:Inter,"Arial",system-ui,-apple-system,sans-serif;background:#080b13;color:var(--text);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 70% 50% at 100% 0%,#25304b58,transparent 65%),radial-gradient(ellipse 50% 60% at -10% 35%,#352d5766,transparent 72%),linear-gradient(90deg,#ffffff03 1px,transparent 1px),linear-gradient(#ffffff03 1px,transparent 1px);background-size:auto,auto,60px 60px,60px 60px}
::selection{background:#d5ff4d;color:#0b0c10}
header{background:#080b14ed;border-color:#353b45;box-shadow:0 12px 40px #0005}
header .top{max-width:1280px;padding:7px 32px;min-height:79px}
.logo{width:208px;height:58px;filter:drop-shadow(0 5px 16px #a995ff18)}
.top-side{display:flex;align-items:center;gap:14px}.top-tag{font-size:10px;letter-spacing:.16em;color:#c5cee0;font-weight:900}
#connection{padding:8px 12px;background:#17211a;border-color:#3b5b46;color:#d5ff4d;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.shell{max-width:1280px;padding:38px 32px 110px}
.eyebrow{color:var(--lime);font-size:11px;letter-spacing:.18em;font-weight:900}
h1,h2,h3{letter-spacing:-.045em;color:#fff}
h2{font-size:clamp(27px,3.4vw,41px);line-height:1.08}
h3{font-size:20px}
p{color:#acb6c7;line-height:1.6}
.lead{font-size:clamp(16px,1.55vw,19px);line-height:1.6}
.panel{background:linear-gradient(160deg,#171d2a,#10141f);border:1px solid #333b4c;border-radius:22px;box-shadow:0 20px 48px #0004}
.btn{min-height:52px;border-radius:11px;border:1px solid #495469;background:#252d3d;color:#f7f9fb;padding:14px 20px;text-decoration:none;letter-spacing:.01em;font-weight:900;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:none;border-color:#94a6c3;box-shadow:0 10px 24px #0004}

.btn:focus-visible,.field:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.field{background:#0b111c;border:1px solid #475166;color:#fff;min-height:54px;padding:13px 15px;border-radius:10px;outline:none}
.field::placeholder{color:#8492a9}
.field:focus{outline:2px solid var(--lime);border-color:transparent}
.label{color:#e3e8f3;font-size:12px;letter-spacing:.04em}
.pill{background:#1a2231;border-color:#38445a;color:#dce6f6;font-weight:850}
.cardline{border-color:#313c4a;margin-top:20px;padding-top:20px}
.status.error{background:#321d2b;color:#ffe5ee;border-color:#a74f73}
.showcase{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(300px,.88fr);gap:clamp(20px,5vw,72px);align-items:center;min-height:590px;padding:18px 0 42px;border-bottom:1px solid #313946}
.showcase-copy{position:relative;z-index:1;min-width:0}

.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px #d5ff4d20}
.showcase-title{font-family:"Arial Black",Impact,system-ui,sans-serif;font-size:clamp(58px,6.4vw,106px);font-weight:950;letter-spacing:-.075em;line-height:.93;margin:26px 0;text-transform:uppercase}
.showcase-title em{display:block;color:var(--lime);font-style:normal}

.showcase-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.showcase-note{font-size:12px;color:#aeb8c8;font-weight:750}
.showcase-metrics{display:flex;gap:34px;flex-wrap:wrap;margin-top:45px}

.beach-stats{margin-top:33px;display:flex;gap:28px;color:#ffe7d3;font-size:10px;font-weight:900;letter-spacing:.15em;justify-content:center;flex-wrap:wrap}
.beach-stats b{color:#ffcd80;font-size:19px;letter-spacing:0;margin-right:6px}
.beach-signature{position:absolute;bottom:23px;right:28px;z-index:4;color:#ffd5b0aa;font-size:10px;letter-spacing:.2em;font-weight:900}
.rules-section{scroll-margin-top:90px;margin-top:50px}
.eyebrow{color:#ffba77}.rule-count{color:#ffcb76}.showcase{display:none}
.panel{background:linear-gradient(150deg,#271a31f6,#151322f6);border-color:#754760aa}
.rule-card{background:linear-gradient(125deg,#271a30,#121b2b);border:1px solid #86516a}
.ranking-intro{background:linear-gradient(115deg,#352337,#1c1b2f);border-left:4px solid #ffbe74;border-color:#965d74}
.travel-setup{border-color:#c17a7d;background:linear-gradient(130deg,#35213c,#161827)}
.travel-setup:before{background:linear-gradient(90deg,#ffc772,#f66da0,#50d3cc)}
.btn.lime,.btn.primary{background:linear-gradient(115deg,#ffd67e,#ffab61);border-color:#ffc477;color:#271220}
.btn.ghost{background:#291d32;border-color:#855877}
.online-options{background:#1e1a2a;border-color:#74536f}
.online-options>summary{background:#292038}
.online-options .panel{background:#1a1726}
.round-panel{background:linear-gradient(160deg,#292038,#15182b)}
.round-panel:before{background:linear-gradient(90deg,#ffa86a,#ed6aaf,#48bdc5)}
.rank-target{background:radial-gradient(circle at 50% 45%,#87446d,#2e2942 56%,#171829);border-color:#a5777f}
.rank-target strong{color:#ffce85}
.live-clock-value{background:#ffc77b;color:#331728}
.scoreboard{background:#171b29}
.final-screen{background:radial-gradient(ellipse at 70% 0%,#b76b6355,transparent 65%),linear-gradient(155deg,#32243b,#131a27);border-color:#d3967d}
.final-screen h1{color:#ffd189}
.beach-footer{position:relative;overflow:hidden;text-align:center;margin-top:70px;padding:65px 20px 45px;border-top:1px solid #b56a8977;background:radial-gradient(ellipse at 50% -20%,#6f2755aa,transparent 67%),linear-gradient(180deg,#141529,#080914);display:flex;flex-direction:column;align-items:center;gap:10px}
.beach-footer:before{content:"";position:absolute;inset:auto -10% 0;height:64px;border-top:2px solid #5bc2c7;background:linear-gradient(180deg,#07616a66,#081323);border-radius:50% 50% 0 0;animation:footerTide 8s ease-in-out infinite alternate;pointer-events:none}
.beach-footer img{width:min(280px,67vw);height:auto;mix-blend-mode:screen;position:relative;z-index:1}
.beach-footer p{position:relative;z-index:1;font-size:12px;letter-spacing:.19em;color:#d9b5b8;text-transform:uppercase}
.beach-footer small{position:relative;z-index:1;color:#8eb9bc;font-size:11px}
@keyframes waveSlide{0%{transform:translateX(-3%) translateY(0)}100%{transform:translateX(4%) translateY(-13px)}}
@keyframes waveSlideBack{0%{transform:translateX(4%) translateY(7px)}100%{transform:translateX(-4%) translateY(-12px)}}
@keyframes cloudSail{0%{transform:translateX(-5%)}100%{transform:translateX(12%)}}
@keyframes sunBloom{0%{filter:brightness(1);transform:scale(.99)}100%{filter:brightness(1.11);transform:scale(1.04)}}
@keyframes shimmer{0%{opacity:.35;transform:translateX(-4%)}100%{opacity:.75;transform:translateX(5%)}}
@keyframes footerTide{0%{transform:translateY(9px) scaleX(1.05)}100%{transform:translateY(-3px) scaleX(.98)}}
@media(max-width:850px){.riviera-beach-hero{margin:0 -22px;min-height:720px;padding:40px 20px 95px}.beach-palm{width:220px}.riviera-master-logo{width:min(460px,85vw)}.riviera-hero-content{margin:0}.beach-stats{gap:13px}}
@media(max-width:600px){header .top{min-height:67px}.logo{width:75px;height:50px}.riviera-beach-hero{margin:0 -15px;min-height:700px;padding:40px 15px 85px}.season-ribbon{letter-spacing:.05em;font-size:9px;padding:8px 10px}.beach-palm{width:165px;opacity:.7}.sunset-orb{top:28%;left:55%;width:175px}.riviera-master-logo{width:min(420px,95vw);max-height:330px;margin:15px 0 -5px}.riviera-hero-content h1{font-size:clamp(29px,8vw,40px)}.riviera-hero-description{font-size:14px;max-width:350px}.riviera-hero-actions{flex-direction:column;align-items:stretch;max-width:335px}.riviera-hero-actions a{min-width:0;width:100%}.beach-stats{margin-top:28px;gap:12px;font-size:9px}.beach-stats b{font-size:16px}.beach-signature{font-size:8px;right:12px;bottom:12px}.rules-section{margin-top:30px}.beach-footer{margin-top:45px;padding:50px 15px 45px}}
@media(prefers-reduced-motion:reduce){.sunset-orb,.beach-cloud,.wave-track,.ocean-glint,.beach-footer:before{animation:none!important;will-change:auto!important}}

// Equivalências conservadoras: números por extenso, acentos, artigos e aliases
// editoriais. Não usa similaridade semântica nem remove negações/qualificadores.
function normalizePhrase(value){
  const numbers={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,catorze:14,quatorze:14,quinze:15,dezesseis:16,dezasseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100};
  const tokens=String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/);
  const converted=[];
  for(let i=0;i<tokens.length;i++){
    const n=numbers[tokens[i]];
    if(n>=20&&n<100&&tokens[i+1]==='e'&&numbers[tokens[i+2]]>0&&numbers[tokens[i+2]]<10){converted.push(String(n+numbers[tokens[i+2]]));i+=2;}
    else converted.push(n===undefined?tokens[i]:String(n));
  }
  return converted.filter(t=>!['o','a','os','as','de','do','da','dos','das'].includes(t)).join(' ');
}
function matchesPhrase(guess,puzzle){
  const actual=normalizePhrase(guess);
  if(!actual)return false;
  return [puzzle.answer,...(puzzle.aliases||[])].some(answer=>{
    const expected=normalizePhrase(answer);
    if(actual===expected)return true;
    // Uma transposição adjacente em palavra longa é um erro de digitação
    // justificável. Números, palavras curtas e demais diferenças são rejeitados.
    const a=actual.split(' '),b=expected.split(' ');
    if(a.length!==b.length)return false;
    const changed=a.map((word,i)=>word===b[i]?-1:i).filter(i=>i>=0);
    if(changed.length!==1)return false;
    const i=changed[0],x=a[i],y=b[i];
    if(x.length<5||x.length!==y.length||!/^[a-z]+$/.test(x+y))return false;
    for(let j=0;j<x.length-1;j++)if(x.slice(0,j)+x[j+1]+x[j]+x.slice(j+2)===y)return true;
    return false;
  });
}
function calculatePhrase({puzzle,guesses,members}){
  return Object.fromEntries(members.map(uid=>{
    const guess=guesses[uid]||'',correct=matchesPhrase(guess,puzzle);
    return [uid,{uid,guess,correct,points:correct?1:0}];
  }));
}


function normalizeItem(value){
  return String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
    .replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ");
}
function isEligibleRanking(list){
  if(!list||typeof list.id!=="string"||!Array.isArray(list.items)||list.items.length<25)return false;
  if(typeof list.source!=="string"||!list.source.trim()||typeof list.snapshot!=="string"||!list.snapshot.trim())return false;
  if(typeof list.url!=="string"||!/^https:\/\//.test(list.url))return false;

 <div class="rank-source"><b>${esc(d.source||"Fonte")}</b> · ${esc(d.snapshot||"Data não informada")} · ${!locked?'Lista incluída no jogo · sem internet':sourceLink}</div>
 ${!locked&&room.localShared?travelControls():locked?`<div class="result" role="status"><div class="eyebrow">RESPOSTA DA POSIÇÃO ${r.target}º</div><strong>${esc(d.items[r.target-1])}</strong><p>Referência: ${esc(d.source||"")}</p></div>${rankReview(r)}`:
 `${confirmed?`<div class="live-submitted"><b>✓ Seu palpite está registrado.</b><p>O texto só será mostrado aos outros depois da revelação. Boa sorte!</p></div>`:expired?`<div class="live-submitted" id="live-time-message"><b>Tempo encerrado.</b><p>Aguardando o resultado da rodada.</p></div>`:`<label class="stack"><span class="label">Seu palpite — escreva o nome de um item</span><input class="field" id="guess" maxlength="120" placeholder="Ex.: Brasil, Japão, O Poderoso Chefão..." value="${esc(guess)}" autocomplete="off"></label>
 <div class="actions">${btn(live?"🔒 Confirmar resposta única":own?"✓ Atualizar meu palpite":"Enviar meu palpite →","guess","lime")}${btn("Não sei · passar vez","skip-guess","ghost")}</div>`}
 <p class="tiny" role="status">🔒 ${sent}/${total} jogadores enviaram. Os textos ficam privados até a revelação. ${own?"Seu último palpite salvo: "+esc(own):""}</p>
 ${sent<total?`<p class="tiny">Aguardando: ${esc(pending.join(", "))}.</p>`:"<p class='tiny highlight'>Todos enviaram. A revelação está liberada.</p>"}${isHost()?btn("👁 Revelar palpites de todos","reveal","primary",sent<total&&!expired):"<p class='tiny'>Os resultados aparecerão juntos quando o anfitrião revelar.</p>"}`}
 </section><aside class="panel scoreboard"><div class="eyebrow">PARTIDA EM ANDAMENTO</div><h3>Placar acumulado</h3>${roster()}</aside></div>`;
}
function finishedGame(){
const ranked=members().map(m=>({...m,points:room.scores?.[m.uid]||0})).sort((a,b)=>b.points-a.points||a.nick.localeCompare(b.nick));
const rounds=Object.values(room.roundHistory||{}).sort((a,b)=>a.number-b.number);
const best=ranked[0]?.points??0,winners=ranked.filter(x=>x.points===best);
return `<section class="panel final-screen"><div class="eyebrow">🏁 PARTIDA FINALIZADA</div><h1>Fim de jogo!</h1><p class="lead">${winners.length>1?'Empate na liderança!':'Campeão da noite:'} <strong class="highlight">${esc(winners.map(x=>x.nick).join(' & '))}</strong></p>
<div class="podium">${ranked.map((m,i)=>{const place=ranked.findIndex(player=>player.points===m.points)+1;return `<div class="podium-item"><span>${place===1?'🥇':place===2?'🥈':place===3?'🥉':'#'+place}</span><strong>${esc(m.nick)}</strong><b>${m.points} ponto${m.points===1?'':'s'}</b></div>`}).join('')}</div>
<div class="cardline"><h3>Resumo das ${rounds.length} rodadas</h3>${rounds.map(x=>`<div class="history-row"><span>${x.type==="rank"?"🏆":"🧩"} Rodada ${x.number} · ${esc(x.type==="rank"?(DATA.rankings.find(d=>d.id===x.categoryId)?.title||"Ranking")+" · alvo "+x.target+"º / Top "+x.limit:DATA.puzzles[x.index]?.code||"")}</span><b>${x.awarded?esc(Object.entries(x.awarded||{}).map(([key,points])=>(room.members?.[key]?.nick||"Jogador")+": +"+points).join(" · ")):esc(x.winner?room.members?.[x.winner]?.nick||"Jogador":"Sem vencedor")}</b></div>`).join("")}</div>
<div class="actions cardline">${btn('← Voltar ao início','leave-room','primary')}${isHost()?btn('↻ Jogar revanche','rematch','lime',room.closed):''}${isHost()&&!localDemo?btn('Encerrar sala','close-room','ghost',room.closed):''}</div></section>`;
}
function render(){
 status();const active=document.activeElement,focusId=active?.id||null;
 const value=focusId?active.value:null;
 const previousRound=app.dataset?.round;
 const onlineExpanded=$('.online-options')?.open;
 const banner=err?`<div role="alert" class="status error">${esc(err)}</div>`:'';
 err='';
 saveTravel();
 app.innerHTML=banner+(!room?home():(room.mode!=='rank'||(room.round&&room.round.type!=='rank'))?`<section class="panel"><h2>Este modo está pausado.</h2><p>Por enquanto, estamos jogando apenas Estimativa de Ranking.</p>${btn('Voltar e criar sala de Ranking','leave-room','lime')}</section>`:room.localShared&&room.phase==='playing'&&!room.round.revealed&&!travelTurnOpen?travelHandoff():room.phase==='finished'?finishedGame():room.round?(room.round.type==='letters'?letters():ranking()):waiting());
 if(onlineExpanded&&$('.online-options'))$('.online-options').open=true;
 const screen=`${roomId||'home'}:${room?.phase||''}:${room?.round?.id||''}:${room?.localShared?travelPlayer()?.uid+':'+travelTurnOpen:''}`;
 const sameScreen=screen===renderedScreen;
 if(!sameScreen){renderedScreen=screen;window.scrollTo?.(0,0)}
 const sameRound=previousRound===room?.round?.id;if(app.dataset)app.dataset.round=room?.round?.id||"";
 if(focusId&&sameRound&&sameScreen){const el=document.getElementById(focusId);if(el&&!el.disabled){if(value!==null&&el.tagName!=='SELECT'&&focusId!=='invite')el.value=value;el.focus({preventScroll:true})}}
}
function watchRankingIfNecessary(id,roomValue){
  const r=roomValue?.round;
  const key=r?.id?id+":"+r.id:"";
  if(key===currentGuessRound)return;
  stopGuess();stopSubmissions();stopGuess=()=>{};stopSubmissions=()=>{};
  currentGuessRound=key;ownGuess="";submitted={};
  if(!key||!partyGame||localDemo)return;
  stopGuess=partyGame.watchMyGuess(id,r.id,value=>{ownGuess=value;if(room?.round?.id===r.id)render()},error);
  stopSubmissions=partyGame.watchSubmissions(id,r.id,value=>{submitted=value;if(room?.round?.id===r.id)render()},error);
}
function connectRoom(id){
  if(!roomGateway)throw Error("A conexão da sala ainda não está pronta.");
  currentRoomSubscription?.();clearPresence();stopGuess();stopSubmissions();currentGuessRound="";
  roomId=id;room=null;
  currentRoomSubscription=roomGateway.watchRoom(id,value=>{room=value;watchRankingIfNecessary(id,value);render()},error);
  clearPresence=roomGateway.markPresence(id,error);
  const params=new URLSearchParams(location.search);
  params.set("room",id);
  history.replaceState(null,"",location.pathname+"?"+params.toString());
}
async function joinRoom(id,name){
  if(!roomGateway)throw Error("Salas indisponíveis.");
  await roomGateway.joinRoom({code:id,nick:name});
  connectRoom(id);
}
function selectedMode(){return 'rank'}
function getNick(){const v=($('#nick')?.value||nick).trim().slice(0,28);if(!v)throw Error('Escolha um nick antes de entrar.');nick=v;saveNick(v);return v}
function startDemo(){startDemoLobby();startDemoFromLobby()}
function localChooseRound(){
 const chooser=createPartyGame({api:{},getPuzzles:()=>DATA.puzzles,getRankings:()=>DATA.rankings,randomIndex:random});
 Object.assign(room,chooser.chooseRound(room));
 room.phase="playing";
 room.localGuesses={};ownGuess="";submitted={};guessDrafts={};travelTurnOpen=false;
 // O adversário é explicitamente simulado e nunca é um jogador conectado.
 if(room.members.guest){
   const r=room.round;
   room.localGuesses.guest=r.type==="letters"?DATA.puzzles[r.index].answer:rankData(r).items[Math.min(r.limit-1,r.target+1)];
   submitted.guest=true;
 }
 render();
}
function nextLocalRound(){localAdvance(false)}

function startDemoLobby(){
 if(!rankingReady())throw Error('Os rankings não carregaram. Tente carregar o conteúdo novamente.');
 modeChoice='rank';
 currentRoomSubscription?.();currentRoomSubscription=null;clearPresence();stopGuess();stopSubmissions();currentGuessRound="";
 localDemo=true;roomId="DEMO45";
 room={host:"local",mode:modeChoice,phase:"lobby",number:0,match:1,roundLimit:5,localGame:true,
 members:{local:{uid:"local",nick:"Você (demo)",joined:Date.now(),online:true},
 guest:{uid:"guest",nick:"Amigo simulado",joined:Date.now()+1,online:true}},
 scores:{local:0,guest:0},roundHistory:{},usedLetters:[],usedRanks:[]};
 render();
}

function startDemoFromLobby(){
 if(!localDemo||room?.phase!=="lobby")return;
 localChooseRound();
}

function localScoreCurrentRound(){
 if(room.round.scored)return;
 const r=room.round;
 if(r.type==="rank"){
   if(!r.resultReady)throw Error("Revele os palpites antes de pontuar.");
   const awarded={};
   for(const result of Object.values(r.review||{})){
     awarded[result.uid]=result.points||0;
     room.scores[result.uid]=(room.scores[result.uid]||0)+(result.points||0);
   }
   room.roundHistory[r.id]={id:r.id,number:room.number,type:"rank",categoryId:r.categoryId,
     target:r.target,limit:r.limit,review:r.review,awarded,overrides:r.overrides||{}};
 }else{
   const awarded={};
   for(const result of Object.values(r.review||{})){
     awarded[result.uid]=result.points||0;
     room.scores[result.uid]=(room.scores[result.uid]||0)+(result.points||0);
   }
   room.roundHistory[r.id]={id:r.id,number:room.number,type:"letters",index:r.index,hints:r.hints||0,winner:"",review:r.review,awarded};
 }
 r.scored=true;
}

function localAdvance(finish){
 if(!localDemo||!room?.round?.revealed||room.round.scored)return;
 localScoreCurrentRound();
 if(finish||room.number>=5){room.phase="finished";render();return}
 localChooseRound();
}

function finishLocalDemo(){localAdvance(true)}

function localSubmitGuess(guess,{skip=false}={}){
 const text=String(guess||"").trim();
 if((!text&&!skip)||text.length>120)throw Error("Digite um palpite entre 1 e 120 caracteres.");
 room.localGuesses??={};
 if(room.localShared){
  const player=travelPlayer();
  if(!travelTurnOpen||!player)return;
  room.localGuesses[player.uid]=text;travelTurnOpen=false;guessDrafts={};room.round.hints=0;
 }else{room.localGuesses.local=text;ownGuess=text;submitted.local=true;}
 render();
}

function localReveal(){
 const r=room.round;
 if(r.type==='rank'&&members().some(m=>!Object.hasOwn(room.localGuesses||{},m.uid)))throw Error('Espere todos enviarem um palpite ou passarem a vez antes de revelar.');
 if(r.revealed){render();return}
 r.revealed=true;
 if(r.type==="rank"){
   r.guesses={...(room.localGuesses||{})};
   r.review=localRankScore(r);
   r.resultReady=true;
 }else{
   r.review=calculatePhrase({puzzle:DATA.puzzles[r.index],guesses:room.localGuesses||{},members:Object.keys(room.members)});
   r.resultReady=true;
 }
 render();
}

function localCorrectRanking({player,position,reason}){
 const r=room.round;
 if(r.type!=="rank"||!r.resultReady||r.scored)throw Error("Esta rodada não permite correções.");
 const pos=Number(position),explanation=String(reason||"").trim();
 if(!Number.isInteger(pos)||pos<0||pos>r.limit)throw Error("Informe a posição de 0 até "+r.limit);
 if(explanation.length<8)throw Error("Escreva uma justificativa com pelo menos 8 caracteres.");
 if(!room.members[player])throw Error("Jogador não encontrado.");
 r.overrides??={};r.overrides[player]={position:pos,reason:explanation};
 r.review=localRankScore(r);render();
}
async function handle(action){if(busy)return;
 if(room&&(room.mode!=='rank'||(room.round&&room.round.type!=='rank'))&&!['leave-room','home','stop-demo'].includes(action))return;
 busy=true;try{if(action==='travel-start'){startTravel()}
else if(action==='travel-add'){if(travelNames.length<8)travelNames.push('Amigo '+(travelNames.length+1));render()}
else if(action==='travel-remove'){if(travelNames.length>2)travelNames.pop();render()}
else if(action==='travel-open'&&room?.localShared&&travelPlayer()){travelTurnOpen=true;render()}
else if(action==='travel-skip'&&room?.localShared&&travelTurnOpen){const player=travelPlayer();if(player){room.localGuesses[player.uid]='';travelTurnOpen=false;guessDrafts={};room.round.hints=0;render()}}
else if(action==='travel-pause'){saveTravel();room=null;roomId=null;localDemo=false;travelTurnOpen=false;guessDrafts={};render()}
else if(action==='travel-resume'){
 const saved=savedTravel();if(!saved)throw Error('A partida salva não está disponível. Comece uma nova.');
 currentRoomSubscription?.();currentRoomSubscription=null;clearPresence();stopGuess();stopSubmissions();currentGuessRound='';
 room=saved;roomId='VIAGEM';localDemo=true;travelTurnOpen=false;guessDrafts={};render();
}
else if(action==="demo"){startDemo()}
else if(action==="demo-lobby"){startDemoLobby()}
else if(action==="stop-demo"){localDemo=false;room=null;roomId=null;guessDrafts={};render()}
else if(action==="leave-room"||action==="home"){
  saveTravel();travelTurnOpen=false;guessDrafts={};
  currentRoomSubscription?.();currentRoomSubscription=null;clearPresence();stopGuess();stopSubmissions();currentGuessRound="";
  localDemo=false;room=null;roomId=null;const q=new URLSearchParams(location.search);q.delete("room");
  history.replaceState(null,"",location.pathname+(q.size?"?"+q.toString():""));render()
}
else if(action==="close-room"){if(!isHost()||!roomGateway)throw Error("Apenas o anfitrião pode encerrar.");await roomGateway.closeRoom(roomId)}
else if(action==="retry-data"){await loadData()}
else if(action==="hint"&&localDemo){if(room.round?.type==='letters'){room.round.hints=Math.min(2,room.round.hints+1);render()}}
else if(action==="reveal"&&localDemo){localReveal()}
else if(action==='choose-rank'){modeChoice='rank';render()}
else if(action==='create'||action==='create-live'){if(!onlineReady()||!roomGateway)throw Error('Salas online indisponíveis. Use Jogar neste aparelho ou configure o Firebase.');const name=getNick();const result=await roomGateway.createRoom({nick:name,mode:selectedMode(),live:action==='create-live'});connectRoom(result.code)}
else if(action==='join'){if(!onlineReady())throw Error('Salas online indisponíveis. Use Jogar neste aparelho.');const name=getNick();const id=($('#join-code')?.value||pendingJoinCode||new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(id.length!==6)throw Error('Digite um código de sala válido com 6 caracteres.');await joinRoom(id,name)}
else if(action==='copy'){
 const url=location.origin+location.pathname+'?room='+roomId+(emulatorMode?'&emulator=1':'');
 try{if(!navigator.clipboard?.writeText)throw Error('Clipboard indisponível');await navigator.clipboard.writeText(url);const b=$('[data-action="copy"]');if(b)b.textContent='✓ Link copiado'}
 catch{const field=$('#invite');if(field){field.focus();field.select()}else throw Error('Copie o convite manualmente: '+url)}
}
else if(action==='import'&&isHost()){throw Error('Importação de rankings estará disponível após a curadoria das fontes.')}
else if(action==='start-game'&&localDemo){startDemoFromLobby()}
else if(action==='start-game'){if(!isHost()||!partyGame)throw Error('Somente o anfitrião pode iniciar.');await partyGame.start(roomId)}
else if(action==='next'&&localDemo){nextLocalRound()}
else if(action==='next'){if(!partyGame||!isHost())throw Error('Somente o anfitrião avança.');await partyGame.advance(roomId)}
else if(action==='finish-game'&&localDemo){finishLocalDemo()}
else if(action==='finish-game'){if(!partyGame||!isHost())throw Error('Somente o anfitrião encerra.');await partyGame.advance(roomId,{finish:true})}
else if(action==='rematch'&&isHost()){
 if(localDemo){room.match++;room.phase="lobby";room.number=0;room.scores=Object.fromEntries(members().map(m=>[m.uid,0]));room.roundHistory={};delete room.round;if(room.localShared)localChooseRound();else render()}
 else await partyGame.rematch(roomId);
}
else if(action==='hint'&&isHost()&&partyGame){await partyGame.hint(roomId)}
else if(action==='reveal'&&isHost()&&partyGame){if(room.round?.type==='rank')await partyGame.revealRanking(roomId);else await partyGame.revealPhrase(roomId)}
else if(action==='skip-guess'&&room?.round?.type==='rank'&&!room.round.revealed){
 if(localDemo)localSubmitGuess('',{skip:true});
 else{ownGuess=await partyGame.submitGuess(roomId,'',{skip:true});delete guessDrafts[roomId+':'+room.round.id];render()}
}
else if(action==='guess'&&room?.round&&!room.round.revealed){
 const guess=($('#guess')?.value||guessDrafts[roomId+':'+room.round.id]||'').trim();
 if(localDemo)localSubmitGuess(guess);
 else{if(!partyGame)throw Error('Partida indisponível.');ownGuess=await partyGame.submitGuess(roomId,guess);delete guessDrafts[roomId+':'+room.round.id];render()}
}
else if(action==='override'&&isHost()&&room?.round?.type==='rank'){
 const player=$('#override-player')?.value,position=Number($('#override-pos')?.value);
 const reason=($('#override-reason')?.value||rankOverrideReason||'').trim();
 if(localDemo)localCorrectRanking({player,position,reason});
 else{if(!partyGame)throw Error('Partida indisponível.');await partyGame.correctRanking(roomId,{player,position,reason})}
 rankOverrideReason='';
}
}catch(e){error(e)}finally{busy=false}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault?.();handle(b.dataset.action)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.id==='guess'){e.preventDefault();handle('guess')}});
document.addEventListener('change',e=>{if(e.target.id==='mode')modeChoice='rank'});
document.addEventListener('input',e=>{if(e.target.id==='nick')nick=e.target.value;if(e.target.id==='join-code')pendingJoinCode=e.target.value;if(e.target.dataset?.player!==undefined)travelNames[Number(e.target.dataset.player)]=e.target.value;if(e.target.id==='guess'&&room?.round)guessDrafts[roomId+':'+room.round.id]=e.target.value;if(e.target.id==='override-reason')rankOverrideReason=e.target.value});
async function loadData(){
  if(STANDALONE){
    const embedded=window.RIVIERA_EMBEDDED_DATA;
    if(embedded&&Array.isArray(embedded.puzzles)&&embedded.puzzles.length&&Array.isArray(embedded.rankings)){
      DATA=embedded;dataReady=true;dataProblem="";
    }else{
      DATA={puzzles:[FALLBACK_PUZZLE],rankings:[]};dataReady=false;dataProblem="Não foi possível ler os dados da prévia";
    }
    render();return;
  }
  dataProblem="";
  try{
    const response=await fetch("./data.json");
    if(!response.ok)throw Error("HTTP "+response.status);
    const data=await response.json();
    if(!Array.isArray(data.puzzles)||!data.puzzles.length||!Array.isArray(data.rankings))throw Error("Catálogo inválido");
    DATA=data;dataReady=true;
  }catch(e){
    DATA={puzzles:[FALLBACK_PUZZLE],rankings:[]};
    dataReady=false;dataProblem="Os desafios completos não carregaram ("+(e?.message||"erro desconhecido")+")";
  }
  render();
}
async function bootNetwork(){
  if(STANDALONE){connectionState="local";render();return}
  emulatorMode=(location.hostname==="localhost"||location.hostname==="127.0.0.1")&&new URLSearchParams(location.search).get("emulator")==="1";
  let config;
  try{
    config=(await import("./firebase-config.js")).firebaseConfig;
  }catch(e){connectionState="unavailable";connectionProblem="Falha ao carregar as configurações do Firebase.";render();return}
  if(emulatorMode){
    config={apiKey:"demo-riviera-web",authDomain:"demo-riviera-showdown.firebaseapp.com",
      databaseURL:"https://demo-riviera-showdown-default-rtdb.firebaseio.com",
      projectId:"demo-riviera-showdown",appId:"1:123456789:web:demo"};
  }
  configured=!!(config&&config.apiKey&&config.apiKey!=="COLE_AQUI"&&config.databaseURL?.startsWith("https://"));
  if(!configured){connectionState="unconfigured";render();return}
  connectionState="connecting";render();
  try{
    const [fa,au,da,gatewayModule,phraseModule,partyModule]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js"),
      import("./rooms-v2.js"),
      import("./phrases-v3.js"),
      import("./party-game-v5.js")
    ]);
    ({initializeApp}=fa);
    ({getAuth,signInAnonymously,onAuthStateChanged}=au);
    ({getDatabase,ref,set,update,onValue,get,remove}=da);
    const fapp=initializeApp(config);
    db=getDatabase(fapp);auth=getAuth(fapp);
    if(emulatorMode){
      // Só localhost + ?emulator=1. Nunca aponta a produção para um emulador.
      au.connectAuthEmulator(auth,"http://127.0.0.1:9099",{disableWarnings:true});
      da.connectDatabaseEmulator(db,"127.0.0.1",9000);
    }
    da.onValue(da.ref(db,".info/serverTimeOffset"),snap=>{serverClockOffset=Number(snap.val())||0;});
    onAuthStateChanged(auth,async user=>{
      try{
        if(!user){uid=null;roomGateway=null;phraseGame=null;partyGame=null;connectionState="unavailable";connectionProblem="Autenticação indisponível.";render();return}
        uid=user.uid;
        roomGateway=gatewayModule.makeRoomGateway({
          db,uid,api:{ref:da.ref,get:da.get,set:da.set,runTransaction:da.runTransaction,
            onValue:da.onValue,onDisconnect:da.onDisconnect,serverTimestamp:da.serverTimestamp}
        });
        phraseGame=phraseModule.makePhraseGame({db,uid,api:{ref:da.ref,get:da.get,runTransaction:da.runTransaction},getPuzzles:()=>DATA.puzzles,randomIndex:random});
        partyGame=partyModule.createPartyGame({db,uid,api:{ref:da.ref,get:da.get,set:da.set,runTransaction:da.runTransaction,onValue:da.onValue},getPuzzles:()=>DATA.puzzles,getRankings:()=>DATA.rankings,randomIndex:random});
        connectionState="online";connectionProblem="";
        const pending=new URLSearchParams(location.search).get("room")?.toUpperCase();
        if(pending&&roomGateway.validateCode(pending)&&!roomId&&!localDemo){
          if(await roomGateway.resumeRoom(pending)){connectRoom(pending);return}
        }
        render();
      }catch(e){connectionProblem="Falha ao recuperar a sala: "+e.message;render()}
    });
    await signInAnonymously(auth);
  }catch(e){
    uid=null;db=null;roomGateway=null;phraseGame=null;partyGame=null;connectionState="unavailable";
    connectionProblem="Serviço de salas indisponível: "+(e?.message||"erro de rede");
    render();
  }
}
async function init(){
  render(); // mostra a interface antes de acessar a rede
  await loadData();
  await bootNetwork();
}
init();
if(!STANDALONE&&typeof setInterval==='function')setInterval(updateLiveCountdown,250);

</script></body></html>
