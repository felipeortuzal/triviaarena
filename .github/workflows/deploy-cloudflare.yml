name: Riviera Showdown · Cloudflare Workers multiplayer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
permissions:
  contents: read
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar código multiplayer
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/public/game.js
          node --test cloudflare/game.test.mjs
      - name: Preparar arquivos públicos
        run: |
          node cloudflare/prepare.mjs
          test -s cloudflare/public/offline.html
          test -s cloudflare/public/assets/riviera-reference-beach.jpg
      - name: Publicar no Cloudflare, se acesso configurado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy não executado. Configure os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 0
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
