name: Riviera Showdown · Cloudflare Workers multiplayer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "ranking-match.js"
      - "wrangler.jsonc"
      - "assets/**"
      - "riviera-showdown.html"
      - ".github/workflows/deploy-cloudflare.yml"
permissions:
  contents: read
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar código multiplayer
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/public/game.js
          node --test cloudflare/game.test.mjs
      - name: Preparar arquivos públicos
        run: |
          node cloudflare/prepare.mjs
          test -s cloudflare/public/offline.html
          test -s cloudflare/public/assets/riviera-coast-2026.jpg
          test -s cloudflare/public/assets/riviera-reference-beach.jpg
      - name: Instalar Playwright para testar a interface no Chrome
        run: npm ci --no-audit --no-fund
      - name: Testar dois clientes reais no Worker local (Durable Object)
        env:
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4 dev --local --config wrangler.jsonc --ip 127.0.0.1 --port 8787 > /tmp/riviera-wrangler.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/api/status > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! node cloudflare/integration.mjs; then
            cat /tmp/riviera-wrangler.log
            exit 1
          fi
          if ! node cloudflare/browser.test.mjs; then
            cat /tmp/riviera-wrangler.log
            exit 1
          fi
          node cloudflare/playtest.mjs
      - name: Publicar no Cloudflare, se acesso configurado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy não executado. Configure os secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 0
          fi
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Testar quatro jogadores no domínio oficial quando esta revisão estiver no ar
        env:
          RIVIERA_URL: https://riviera.thegoatgame.com.br/
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 20 "${RIVIERA_URL}game.js" -o "$RUNNER_TEMP/riviera-live.js"
          if cmp -s cloudflare/public/game.js "$RUNNER_TEMP/riviera-live.js"; then
            node cloudflare/playtest.mjs
          else
            echo "::error::O domínio oficial não está servindo a revisão publicada; teste de produção não validado."\n            exit 1
          fi
