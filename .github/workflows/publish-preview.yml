name: Riviera Showdown · HTML para download
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release que receberá o HTML
        required: true
        default: v0.7.0
      revision:
        description: SHA completo da revisão testada
        required: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar HTML da revisão exata da release
        run: |
          npm run build
          git diff --exit-code -- riviera-showdown.html
      - name: Anexar HTML autocontido sem ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}

        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/riviera-release.md" <<'NOTES'
          Baixe riviera-showdown.html e abra por duplo clique, sem instalar programas ou iniciar servidor. Modo viagem com 2 a 8 pessoas no mesmo aparelho, respostas escondidas entre os turnos, pausa e retomada. Três modos, cinco rodadas, placar automático, pódio e revanche. A demonstração com adversário simulado é uma opção separada.

          Modo viagem offline, HTML file:// e três modos em dois navegadores contra Firebase Emulator verificados. Produção e dois aparelhos físicos continuam pendentes.

          O GitHub Pages ainda retorna 404: habilitação via API recusada com 403. Firebase de produção não autenticado. Esta release oferece o HTML local e não significa multiplayer público disponível.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" riviera-showdown.html --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" riviera-showdown.html --target "$SOURCE_SHA" --title "Riviera Showdown $RELEASE_TAG — Modo viagem" --notes-file "$RUNNER_TEMP/riviera-release.md" --repo "$GITHUB_REPOSITORY"
          fi
