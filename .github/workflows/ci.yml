name: Riviera Showdown · Qualidade e salas seguras
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
concurrency:
  group: riviera-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências de desenvolvimento
        run: npm install --no-audit --no-fund
      - name: Testes Node e build da prévia
        run: npm test
      - name: Chrome - HTML offline e URL com prefixo
        run: node tests/browser-smoke.mjs
      - name: Regras no Emulator Suite - Auth e Realtime Database
        run: npm run test:rooms
      - name: HTML produzido da mesma revisão do frontend
        run: git diff --exit-code -- riviera-showdown.html
