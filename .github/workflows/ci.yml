name: Riviera Showdown · Etapa 1
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar inicialização e gerar prévia
        run: npm test
      - name: Testar Chrome real com HTTP prefixado, falha de CDN e arquivo offline
        run: |
          npm install --no-save playwright-core@1.58.0
          node tests/browser-smoke.mjs
      - name: Conferir HTML gerado sem divergências
        run: git diff --exit-code -- riviera-showdown.html
